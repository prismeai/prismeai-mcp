name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate skills
        run: npm run validate:skills

      - name: Reject placeholder body-field types in skill templates
        # prisme.ai-bugs#3046: a body field typed `object` "shape varies per
        # action" makes schema-following models (Claude) send lists and booleans
        # as strings. Every body field takes its OpenAPI requestBody type.
        run: |
          if grep -rn --include='*.yml' 'shape varies per action' plugin/skills/*/reference; then
            echo "::error::Body fields must take their OpenAPI type, never a placeholder object (see app-mcp-implement SKILL.md, Phase 5 item 4)."
            exit 1
          fi

      - name: Validate release versions
        run: npm run validate:versions

      - name: Verify committed plugin bundle
        run: |
          npm run build:bundle
          git diff --exit-code -- plugin/build/index.js
