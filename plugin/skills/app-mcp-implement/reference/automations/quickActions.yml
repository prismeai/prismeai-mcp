slug: quickActions
name: MCP/tools/quickActions
labels:
  - mcp:tool
private: true
description: |-
  Quick Actions — list/describe/invoke org-level quick actions (object-specific actions like LogACall, NewTask, …).

  Available actions:
  - **describe** (describeQuickAction): Describe a specific quick action — params: path: actionName
  - **invoke** (invokeQuickAction): Invoke a quick action with payload — params: path: actionName
  - **list** (listQuickActions): Global quick actions
when:
  endpoint: true
arguments:
  action:
    type: string
    description: Operation to perform on quickActions.
    enum:
      - describe
      - invoke
      - list
    required: true
  actionName:
    type: string
    description: Salesforce path parameter `actionName`.
  body:
    type: object
    additionalProperties: true
    description: 'JSON request body. Required for actions: invoke.'
  outputFormat:
    type: string
    enum:
      - structured
      - verbose
      - both
    default: verbose
    description: Response format for the MCP client.
do:
  - comment: 'Facade for the MCP tool `quickActions`: it IS the tool. Its description and arguments are what tools/list serves, read straight from this file, and the action -> operation mapping lives here explicitly rather than in a central table.'
  - comment: 'Endpoint reachable ONLY through the MCP dispatch. `when.endpoint` makes it a public webhook and `private` does NOT close that (the trigger registry ignores it), so require a marker header: the runtime strips incoming x-* headers, so an external caller cannot forge it, while the internal dispatch fetch forwards it. Without this, tools/call could be reached anonymously, bypassing validateAgent entirely.'
  - conditions:
      '!{{headers["x-mcp-dispatch"]}}':
        - set:
            name: $http
            value:
              status: 403
        - set:
            name: result
            value:
              content:
                - type: text
                  text: Direct calls are not allowed — use the MCP endpoint.
              isError: true
        - break: {}
  - comment: A webhook delivers its payload in the body WITHOUT mapping it onto the declared arguments. The facade is MCP-only (see the guard above), so the body is the source of truth.
  - set:
      name: act
      value: '{{body.action}}'
  - set:
      name: args
      value: '{{body}}'
  - comment: Reject invalid input BEFORE any network call.
  - conditions:
      '!{{act}}':
        - set:
            name: result
            value:
              content:
                - type: text
                  text: 'Missing required argument `action` for `quickActions`. Available: describe, invoke, list'
              isError: true
        - break: {}
  - comment: 'Self-contained: the facade resolves its own auth, so the tool works from MCP, from a webhook or in App-mode alike.'
  - buildAppAuth:
      output: auth
  - conditions:
      '{{auth.error}}':
        - set:
            name: result
            value:
              content:
                - type: text
                  text: '{{auth.error}}'
              isError: true
        - break: {}
  - conditions:
      '{{act}} == "describe"':
        - toolRestOp:
            toolName: describeQuickAction
            spec:
              method: GET
              path: /quickActions/{actionName}
              pathParams:
                - actionName
            body:
              arguments: '{{args}}'
              accessToken: '{{auth.accessToken}}'
              baseUrl: '{{auth.baseUrl}}'
            output: result
      '{{act}} == "invoke"':
        - toolRestOp:
            toolName: invokeQuickAction
            spec:
              method: POST
              path: /quickActions/{actionName}
              pathParams:
                - actionName
              bodyPassthrough: true
            body:
              arguments: '{{args}}'
              accessToken: '{{auth.accessToken}}'
              baseUrl: '{{auth.baseUrl}}'
            output: result
      '{{act}} == "list"':
        - toolRestOp:
            toolName: listQuickActions
            spec:
              method: GET
              path: /quickActions
            body:
              arguments: '{{args}}'
              accessToken: '{{auth.accessToken}}'
              baseUrl: '{{auth.baseUrl}}'
            output: result
      default:
        - set:
            name: result
            value:
              content:
                - type: text
                  text: 'Unknown action `{{act}}` for `quickActions`. Available: describe, invoke, list'
              isError: true
output: '{{result}}'
