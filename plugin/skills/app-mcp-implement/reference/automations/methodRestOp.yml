slug: methodRestOp
name: /Methods/methodRestOp
description: Generic REST dispatcher. The operation spec is supplied by the CALLER (tool facade or App-mode wrapper); this automation only builds the request from it via the pure `buildRequest` helper — no registry.
private: true
arguments:
  operationName:
    type: string
  args:
    type: object
  accessToken:
    type: string
  baseUrl:
    type: string
    description: Full Salesforce REST base — `{instance_url}/services/data/{apiVersion}`.
  apiVersion:
    type: string
  spec:
    type: object
    description: 'REST spec: {method, path, pathParams, queryParams, bodyPassthrough...}'
do:
  - Custom Code.run:
      function: buildRequest
      parameters:
        spec: '{{spec}}'
        args: '{{args}}'
      output: req
  - conditions:
      '{{req.error}}':
        - set:
            name: result
            value:
              success: false
              error:
                isError: true
                content:
                  - type: text
                    text: 'Salesforce request build failed for {{operationName}}: {{req.error}}'
        - break: {}
  - executeApiCall:
      path: '{{req.path}}'
      method: '{{req.method}}'
      query: '{{req.query}}'
      body: '{{req.body}}'
      rawBody: '{{req.rawBody}}'
      contentType: '{{req.contentType}}'
      accessToken: '{{accessToken}}'
      baseUrl: '{{baseUrl}}'
      operation: '{{operationName}}'
      output: apiResult
  - set:
      name: result
      value: '{{apiResult}}'
output: '{{result}}'
