slug: runCompositeBatch
name: runCompositeBatch
description: Execute up to 25 independent sub-requests (no refs) (POST /composite/batch). Calls the Salesforce REST API via the resolved per-user OAuth session (or JWT Bearer fallback). Public App-mode automation — tenants call `Salesforce.runCompositeBatch:` directly from their own automations.
arguments:
  haltOnError:
    type: boolean
    description: true stops at the first failed sub-request. Default false.
  batchRequests:
    type: array
    description: Independent sub-requests (25 at most), with no references between them.
    items:
      type: object
      additionalProperties: true
      properties:
        method:
          type: string
          description: GET, POST, PATCH or DELETE.
        url:
          type: string
          description: Path relative to /services/data, e.g. v62.0/sobjects/Account/001xx000003DGb2AAG.
        richInput:
          type: object
          additionalProperties: true
          description: Record fields, for a write.
do:
  - buildAppAuth:
      output: auth
  - conditions:
      '{{auth.error}}':
        - set:
            name: result
            value:
              error: '{{auth.error}}'
        - break: {}
  - set:
      name: methodArgs
      value:
        haltOnError: '{{haltOnError}}'
        batchRequests: '{{batchRequests}}'
  - methodRestOp:
      operationName: runCompositeBatch
      args: '{{methodArgs}}'
      accessToken: '{{auth.accessToken}}'
      baseUrl: '{{auth.baseUrl}}'
      output: apiResult
  - conditions:
      '!{{apiResult.success}}':
        - set:
            name: result
            value:
              error: '{{apiResult.error}}'
        - break: {}
  - set:
      name: result
      value: '{{apiResult.data}}'
output: '{{result}}'
