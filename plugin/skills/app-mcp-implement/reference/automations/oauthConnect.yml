slug: oauthConnect
name: OAuth/oauthConnect
description: >-
  Per-user OAuth2 (authorization-code + PKCE) connect endpoint. Opened in the
  user's browser (Connexion button / agent-factory connect_url). Reads the tenant
  Connected App creds from field-level config values, builds a stateless
  HMAC-signed state (signOAuthState — the PKCE verifier is derived from its
  nonce, nothing is written to the user context) and redirects to Salesforce's
  authorize endpoint. oauthCallback verifies the state, exchanges the code and
  stores the tokens in user-scoped secrets. Pattern of powerbi `oauthConnect`.
private: true
when:
  endpoint: true
schemas:
  - output:
      redact: true
do:
  - conditions:
      '!{{user.id}}':
        - set:
            name: $http
            value:
              status: 401
        - set:
            name: output
            value: Authentication required. Please log in to Prisme.ai first.
        - break: {}
  - set:
      name: a
      value:
        loginHost: '{{config.loginHost}}'
        oauthClientId: '{{config.oauthClientId}}'
        oauthClientSecret: '{{config.oauthClientSecret}}'
        oauthAuthorizeUrl: '{{config.oauthAuthorizeUrl}}'
        oauthScopes: '{{config.oauthScopes}}'
  - conditions:
      '!{{a.oauthClientId}} || !{{a.oauthClientSecret}} || !{{a.oauthAuthorizeUrl}} || !{{a.oauthScopes}}':
        - set:
            name: $http
            value:
              status: 400
        - set:
            name: output
            value: Salesforce OAuth is incomplete. Configure the client, authorize URL and scopes in the config app before connecting.
        - break: {}
  - comment: OAuth endpoints live on *.my.salesforce.com, never on the Lightning UI host.
  - Custom Code.run:
      function: normalizeLoginHost
      parameters:
        rawHost: '{{a.loginHost}}'
      output: lh
  - set:
      name: loginHost
      value: '{{lh.host}}'
  - comment: Stateless signed state + derived PKCE verifier — nothing is written to the user context. The callback may run on another worker whose cached user context does not hold a value written here yet (the intermittent `invalid_state`), and a second Connect click used to overwrite the first popup's state.
  - Custom Code.run:
      function: signOAuthState
      parameters:
        uid: '{{user.id}}'
        secret: '{{a.oauthClientSecret}}'
      output: stateResult
  - conditions:
      '{{stateResult.error}}':
        - set:
            name: $http
            value:
              status: 500
        - set:
            name: output
            value: Could not start the Salesforce sign-in. Please retry.
        - break: {}
  - Custom Code.run:
      function: buildAuthorizeUrl
      parameters:
        authorizeUrl: '{{a.oauthAuthorizeUrl}}'
        clientId: '{{a.oauthClientId}}'
        redirectUri: '{{config.oauthCallbackUrl}}'
        scopes: '{{a.oauthScopes}}'
        state: '{{stateResult.state}}'
        codeChallenge: '{{stateResult.codeChallenge}}'
      output: urlResult
  - set:
      name: $http
      value:
        headers:
          Content-Type: text/html
  - set:
      name: output
      value: >-
        <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url={{urlResult.url}}"><title>Redirecting to Salesforce…</title></head><body style="font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:48px">Redirecting to Salesforce… <a href="{{urlResult.url}}">continue</a></body></html>
output: '{{output}}'
