slug: oauthDisconnect
name: OAuth/oauthDisconnect
description: >-
  Disconnect the current user's Salesforce OAuth session: best-effort token
  revocation, then delete the user-scoped token secrets, the workspace mirror of
  the refresh token and the connection metadata. Opened in a popup by the config
  app and by agent-factory's capability `disconnect_url` (both navigate to it,
  never fetch it server-side) — so it always redirects (meta-refresh, CSP-safe)
  to the SPA callback view (?view=oauthCallback&status=disconnected), which
  auto-closes.
private: true
when:
  endpoint: true
schemas:
  - output:
      redact: true
do:
  - conditions:
      '{{user.id}}':
        - Custom Code.run:
            function: makeTokenCacheKey
            parameters:
              tenantId: '{{global.workspaceId}}'
              clientId: '{{config.oauthClientId}}'
              scopes: '{{config.oauthScopes}}'
            output: tokenCache
        - Custom Code.run:
            function: makeTokenSecretName
            parameters:
              userId: '{{user.id}}'
              cacheKey: '{{tokenCache.key}}'
            output: tokName
        - conditions:
            '!{{tokName.error}}':
              - comment: Revoke the refresh token (it ends the whole grant at the provider). The secret ref resolves inside the fetch body; only a `$secret:` ref is sent.
              - try:
                  do:
                    - run:
                        module: secrets
                        function: get
                        parameters:
                          name: '{{tokName.name}}'
                          scope: user
                        output: rtSecret
                  catch:
                    - set:
                        name: rtSecret
                        value:
                          error: '{{$error.message}}'
              - conditions:
                  '{{rtSecret}} matches "$secret:" and {{config.oauthRevokeUrl}}':
                    - fetch:
                        url: '{{config.oauthRevokeUrl}}'
                        method: POST
                        headers:
                          Content-Type: application/x-www-form-urlencoded
                        body:
                          token: '{{rtSecret}}'
                        output: revokeResp
                        outputMode: detailed_response
                        emitErrors: false
              - try:
                  do:
                    - run:
                        module: secrets
                        function: delete
                        parameters:
                          name: '{{tokName.name}}'
                          scope: user
                  catch:
                    - set:
                        name: _rtDelErr
                        value: '{{$error.message}}'
              - try:
                  do:
                    - run:
                        module: secrets
                        function: delete
                        parameters:
                          name: '{{tokName.accessName}}'
                          scope: user
                  catch:
                    - set:
                        name: _atDelErr
                        value: '{{$error.message}}'
              - comment: The workspace mirror (cron store). A member rule can never grant `delete`, so it takes the tokenDepositor role (bound to this user's own name) — best-effort.
              - try:
                  do:
                    - run:
                        module: secrets
                        function: delete
                        assumeRole: tokenDepositor
                        parameters:
                          name: '{{tokName.name}}'
                          scope: workspace
                  catch:
                    - set:
                        name: _rtWsDelErr
                        value: '{{$error.message}}'
  - delete:
      name: user.salesforceNext.oauth
      scope: user
  - set:
      name: $http
      value:
        headers:
          Content-Type: text/html
  - set:
      name: redirectTo
      value: '{{global.studioUrl}}/apps/salesforce-next?view=oauthCallback&status=disconnected'
output: |
  <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url={{redirectTo}}"><title>Salesforce</title></head><body style="font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:48px">Redirecting… <a href="{{redirectTo}}">continue</a></body></html>
