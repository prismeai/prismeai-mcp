slug: createQueryJob
name: createQueryJob
description: Create a bulk SOQL query job (returns jobId for polling) (POST /jobs/query). Calls the Salesforce REST API via the resolved per-user OAuth session (or JWT Bearer fallback). Public App-mode automation — tenants call `Salesforce.createQueryJob:` directly from their own automations.
arguments:
  operation:
    type: string
    description: query, or queryAll to include deleted and archived records.
    enum:
    - query
    - queryAll
  query:
    redact: true
    type: string
    description: The SOQL query.
  contentType:
    type: string
    description: Format of the results. Only CSV is supported.
    enum:
    - CSV
  lineEnding:
    type: string
    description: Line ending of the results. Default LF.
    enum:
    - LF
    - CRLF
  columnDelimiter:
    type: string
    description: Column delimiter of the results. Default COMMA.
    enum:
    - BACKQUOTE
    - CARET
    - COMMA
    - PIPE
    - SEMICOLON
    - TAB
do:
  - buildAppAuth:
      output: auth
  - conditions:
      '{{auth.error}}':
        - set:
            name: result
            value:
              error: '{{auth.error}}'
        - break: {}
  - set:
      name: methodArgs
      value:
        operation: '{{operation}}'
        query: '{{query}}'
        contentType: '{{contentType}}'
        lineEnding: '{{lineEnding}}'
        columnDelimiter: '{{columnDelimiter}}'
  - methodRestOp:
      operationName: createQueryJob
      args: '{{methodArgs}}'
      accessToken: '{{auth.accessToken}}'
      baseUrl: '{{auth.baseUrl}}'
      output: apiResult
  - conditions:
      '!{{apiResult.success}}':
        - set:
            name: result
            value:
              error: '{{apiResult.error}}'
        - break: {}
  - set:
      name: result
      value: '{{apiResult.data}}'
output: '{{result}}'
