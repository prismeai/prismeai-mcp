slug: executeApiCall
name: /Helpers/executeApiCall
description: 'Execute a Salesforce REST API call with auth. `baseUrl` is the full `{instance_url}/services/data/{apiVersion}` (instance URL is returned by the OAuth token endpoint and stored per-user; apiVersion comes from config). Auth header is `Authorization: Bearer {accessToken}`. Returns { success, data, status } or { success: false, error, data, status }.'
private: true
arguments:
  path:
    type: string
    description: Relative path under the API version root (no leading slash).
  method:
    type: string
    description: HTTP method (POST default, GET, PUT, PATCH, DELETE).
  body:
    type: object
    description: Request JSON body.
  rawBody:
    type: string
    description: Raw body — takes precedence over `body`. Used for Bulk API CSV ingest (uploadIngestData) and metadata zip uploads.
  contentType:
    type: string
    description: Override Content-Type. Default is application/json. Bulk CSV upload uses text/csv.
  query:
    type: object
    description: Query string parameters (will be URL-encoded).
  accessToken:
    type: string
    secret: true
  baseUrl:
    type: string
    description: Full Salesforce REST API base — `{instance_url}/services/data/{apiVersion}`.
  operation:
    type: string
    description: Short description used in error messages.
  _testResponses:
    type: object
    description: 'TEST-ONLY seam, inert in production (no tool or method layer forwards it). `{ validToken, accepted, rejected, freshAuth }`: the result then carries `testAttempts`, the number of requests sent; each attempt answers `accepted` when the request carries `Bearer {validToken}` and `rejected` otherwise — a provider that only honours a live token — and the forced refresh returns `freshAuth` instead of running buildAppAuth. See tests-tokenExpiry.'
do:
  - conditions:
      '!{{baseUrl}}':
        - set:
            name: result
            value:
              success: false
              error:
                isError: true
                content:
                  - type: text
                    text: Salesforce baseUrl not resolved — auth context returned no instance_url.
              status: 0
        - break: {}
  - set:
      name: effectiveMethod
      value: '{% {{method}} || "POST" %}'
  - set:
      name: qs
      value: ''
  - conditions:
      '{{query}}':
        - Custom Code.run:
            function: buildQueryString
            parameters:
              params: '{{query}}'
            output: qs
  - set:
      name: fetchHeaders
      value:
        Authorization: Bearer {{accessToken}}
        Accept: application/json
  - conditions:
      '{{effectiveMethod}} == "POST" || {{effectiveMethod}} == "PUT" || {{effectiveMethod}} == "PATCH"':
        - set:
            name: fetchHeaders.Content-Type
            value: '{% {{contentType}} || "application/json" %}'
  - comment: 'A 401 on a token served from the interactive store (an opaque `$secret:` ref — buildAppAuth tracks no expiry for it) means that token is dead: mint a fresh one (buildAppAuth forceRefresh, under the renewal lease) and replay the request ONCE, hence the two turns of this loop. Tokens minted on the spot (cron) or supplied by the caller are not retried — a 401 there is not an expiry, and re-minting would only hide it. A second 401 falls through to the normal error path. Pattern of powerbi / google-workspaces executeApiCall.'
  - set:
      name: _testAttempts
      value: 0
  - repeat:
      until: 2
      do:
        - conditions:
            '{{_testResponses}}':
              - comment: Test seam — see the `_testResponses` argument. Counts the requests sent, so a test can tell one replay from two.
              - set:
                  name: _testAttempts
                  value: '{% {{_testAttempts}} + 1 %}'
              - set:
                  name: testBearer
                  value: Bearer {{_testResponses.validToken}}
              - conditions:
                  '{{fetchHeaders.Authorization}} == {{testBearer}}':
                    - set:
                        name: response
                        value: '{{_testResponses.accepted}}'
                  default:
                    - set:
                        name: response
                        value: '{{_testResponses.rejected}}'
            '{{effectiveMethod}} == "GET" || {{effectiveMethod}} == "DELETE"':
              - fetch:
                  url: '{{baseUrl}}/{{path}}{{qs}}'
                  method: '{{effectiveMethod}}'
                  headers: '{{fetchHeaders}}'
                  output: response
                  outputMode: detailed_response
                  emitErrors: false
            default:
              - conditions:
                  '{{rawBody}}':
                    - fetch:
                        url: '{{baseUrl}}/{{path}}{{qs}}'
                        method: '{{effectiveMethod}}'
                        headers: '{{fetchHeaders}}'
                        body: '{{rawBody}}'
                        output: response
                        outputMode: detailed_response
                        emitErrors: false
                  '{{body}}':
                    - fetch:
                        url: '{{baseUrl}}/{{path}}{{qs}}'
                        method: '{{effectiveMethod}}'
                        headers: '{{fetchHeaders}}'
                        body: '{{body}}'
                        output: response
                        outputMode: detailed_response
                        emitErrors: false
                  default:
                    - fetch:
                        url: '{{baseUrl}}/{{path}}{{qs}}'
                        method: '{{effectiveMethod}}'
                        headers: '{{fetchHeaders}}'
                        body: {}
                        output: response
                        outputMode: detailed_response
                        emitErrors: false
        - conditions:
            '{{response.status}} == 401 and {{$index}} == 0 and {{accessToken}} matches "$secret:"':
              - conditions:
                  '{{_testResponses}}':
                    - set:
                        name: freshAuth
                        value: '{{_testResponses.freshAuth}}'
                  default:
                    - buildAppAuth:
                        forceRefresh: true
                        output: freshAuth
              - conditions:
                  '{{freshAuth.accessToken}} and {{freshAuth.accessToken}} != {{accessToken}}':
                    - set:
                        name: fetchHeaders.Authorization
                        value: Bearer {{freshAuth.accessToken}}
                  default:
                    - break:
                        scope: repeat
            default:
              - break:
                  scope: repeat
  - comment: The replay could not get a fresh token. buildAppAuth already says why, with the provider's reason — AUTH_EXPIRED (sign in again, `requiresOAuth`), TEMPORARY (retry) or OAUTH_CLIENT_MISCONFIGURED (an administrator must act) — whereas the generic 401 text of handleApiError would tell the agent to "check the credentials" whatever the cause. The text starts with the code, which is what agent-factory reads to raise the connect card.
  - conditions:
      '{{response.status}} == 401 and {{freshAuth.error}}':
        - set:
            name: result
            value:
              success: false
              error:
                isError: true
                content:
                  - type: text
                    text: '{{freshAuth.error}}'
              code: '{{freshAuth.code}}'
              requiresOAuth: '{{freshAuth.requiresOAuth}}'
              transient: '{{freshAuth.transient}}'
              status: 401
        - conditions:
            '{{_testResponses}}':
              - set:
                  name: result.testAttempts
                  value: '{{_testAttempts}}'
        - break: {}
  - handleApiError:
      response: '{{response}}'
      operation: '{{operation}}'
      output: errorResult
  - conditions:
      '{{errorResult}}':
        - set:
            name: result
            value:
              success: false
              error: '{{errorResult}}'
              data: '{{response.body}}'
              status: '{{response.status}}'
        - conditions:
            '{{_testResponses}}':
              - set:
                  name: result.testAttempts
                  value: '{{_testAttempts}}'
        - break: {}
  - set:
      name: result
      value:
        success: true
        data: '{{response.body}}'
        status: '{{response.status}}'
  - conditions:
      '{{_testResponses}}':
        - set:
            name: result.testAttempts
            value: '{{_testAttempts}}'
output: '{{result}}'
