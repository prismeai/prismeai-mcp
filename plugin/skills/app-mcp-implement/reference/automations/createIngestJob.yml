slug: createIngestJob
name: createIngestJob
description: Create a new bulk ingest job (operation + sObject + lineEnding + columnDelimiter) (POST /jobs/ingest). Calls the Salesforce REST API via the resolved per-user OAuth session (or JWT Bearer fallback). Public App-mode automation — tenants call `Salesforce.createIngestJob:` directly from their own automations.
arguments:
  object:
    type: string
    description: sObject the job writes to, e.g. Account.
  operation:
    type: string
    description: Write operation of the job.
    enum:
    - insert
    - delete
    - hardDelete
    - update
    - upsert
  externalIdFieldName:
    type: string
    description: External ID field used to match records, required for upsert.
  contentType:
    type: string
    description: Format of the data. Only CSV is supported.
    enum:
    - CSV
  lineEnding:
    type: string
    description: Line ending of the CSV. Default LF.
    enum:
    - LF
    - CRLF
  columnDelimiter:
    type: string
    description: Column delimiter of the CSV. Default COMMA.
    enum:
    - BACKQUOTE
    - CARET
    - COMMA
    - PIPE
    - SEMICOLON
    - TAB
  assignmentRuleId:
    type: string
    description: ID of the assignment rule applied to Case or Lead records.
do:
  - buildAppAuth:
      output: auth
  - conditions:
      '{{auth.error}}':
        - set:
            name: result
            value:
              error: '{{auth.error}}'
        - break: {}
  - set:
      name: methodArgs
      value:
        object: '{{object}}'
        operation: '{{operation}}'
        externalIdFieldName: '{{externalIdFieldName}}'
        contentType: '{{contentType}}'
        lineEnding: '{{lineEnding}}'
        columnDelimiter: '{{columnDelimiter}}'
        assignmentRuleId: '{{assignmentRuleId}}'
  - methodRestOp:
      operationName: createIngestJob
      args: '{{methodArgs}}'
      accessToken: '{{auth.accessToken}}'
      baseUrl: '{{auth.baseUrl}}'
      output: apiResult
  - conditions:
      '!{{apiResult.success}}':
        - set:
            name: result
            value:
              error: '{{apiResult.error}}'
        - break: {}
  - set:
      name: result
      value: '{{apiResult.data}}'
output: '{{result}}'
