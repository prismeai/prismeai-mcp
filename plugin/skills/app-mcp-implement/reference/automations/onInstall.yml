slug: onInstall
name: MCP/onInstall
description: >-
  Provision the tenant app-instance on install/configure (tenant-context model,
  NO HMAC key). Sets the MCP endpoint (this instance's own webhook) + the config
  app link, provisions one tenant secret per auth field — each holding a single
  plain value, never an aggregate `salesforceNextAuth` object — plus
  `salesforceNextAuthorizedAgents` (agent allowlist), and writes the two-hop
  bindings (binding B in workspace `config.value` via a minted workspace JWT,
  then binding A as a terminal `set: config` merge) so the field-level
  `config.authMode` / `config.oauthClientId` / … / `config.authorizedAgents`
  values resolve. Exposed URLs use `slug:<slug>` by default (re-import / rename stable);
  the raw id is used only for `/config` + `/security/secrets` (don't resolve slug)
  and — for Microsoft Entra connectors only — the OAuth callback. Idempotent.
private: true
when:
  events:
    - workspaces.apps.installed
    - workspaces.apps.configured
do:
  - conditions:
      '!{{run.appInstanceSlug}}':
        - emit:
            event: salesforce.onInstall.skipped
            payload:
              reason: no-app-instance-slug
        - break: {}
  - auth:
      workspace: true
      output: wsJwt
  - comment: >-
      Resolve BOTH the raw id and the slug of the tenant workspace via one GET
      (works whether global.workspaceId is the raw id or the slug:<slug> form).
      Exposed endpoints use slug:<slug> by DEFAULT — the slug survives a re-import
      (the workspace id changes on every re-import while you debug an install, the
      slug stays stable), so a slug-form callback stays valid across attempts. Two
      exceptions are FORCED to the raw id: (1) the OAuth callback ONLY for Microsoft
      Entra, which rejects the ':' of slug:<slug> in a redirect URI (Google /
      Salesforce tolerate it → keep slug); (2) /config + /security/secrets, which
      don't resolve slug:<slug> (404). configAppUrl passes BOTH forms so the SPA has
      the raw id (for /security/secrets) and the slug (for its slug-form URLs).
  - fetch:
      url: '{{global.apiUrl}}/workspaces/{{global.workspaceId}}'
      method: GET
      headers:
        Authorization: Bearer {{wsJwt.jwt}}
      outputMode: body
      emitErrors: false
      output: wsInfo
  - set:
      name: slugRef
      value: '{{wsInfo.id}}'
  - conditions:
      '{{wsInfo.slug}}':
        - set:
            name: slugRef
            value: 'slug:{{wsInfo.slug}}'
  - set:
      name: configAppUrl
      value: '{{global.studioUrl}}/apps/salesforce?workspaceId={{wsInfo.id}}&workspaceSlug={{wsInfo.slug}}&appInstance={{run.appInstanceSlug}}'
  - comment: >-
      oauthCallbackUrl: slug:<slug> by default (re-import / rename stable). For a
      MICROSOFT ENTRA connector, swap slugRef for {{wsInfo.id}} on this line only —
      Entra rejects the ':' in the redirect URI. See the powerbi connector.
  - set:
      name: oauthCallbackUrl
      value: '{{global.apiUrl}}/workspaces/{{slugRef}}/webhooks/{{run.appInstanceSlug}}.oauthCallback'
  - set:
      name: secretsUrl
      value: '{{global.apiUrl}}/workspaces/{{wsInfo.id}}/security/secrets'
  - fetch:
      url: '{{secretsUrl}}'
      method: GET
      headers:
        Authorization: Bearer {{wsJwt.jwt}}
      output: existingSecretsResp
      outputMode: detailed_response
      emitErrors: false
  - set:
      name: existingSecrets
      value: '{{existingSecretsResp.body}}'
  - set:
      name: toProvision
      value: {}
  - set:
      name: provisionCount
      value: 0
  - conditions:
      '!{{existingSecrets.salesforceNextAuthMode}}':
        - set:
            name: toProvision.salesforceNextAuthMode
            value: {value: jwt, description: 'Salesforce auth mode.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextLoginHost}}':
        - set:
            name: toProvision.salesforceNextLoginHost
            value: {value: '', description: 'Salesforce OAuth login host.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextJwtUsername}}':
        - set:
            name: toProvision.salesforceNextJwtUsername
            value: {value: '', description: 'Salesforce JWT username.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthClientId}}':
        - set:
            name: toProvision.salesforceNextOAuthClientId
            value: {value: '', description: 'Salesforce OAuth client id.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthClientSecret}}':
        - set:
            name: toProvision.salesforceNextOAuthClientSecret
            value: {value: '', description: 'Salesforce OAuth client secret.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextJwtPrivateKey}}':
        - set:
            name: toProvision.salesforceNextJwtPrivateKey
            value: {value: '', description: 'Salesforce JWT private key.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextAccessToken}}':
        - set:
            name: toProvision.salesforceNextAccessToken
            value: {value: '', description: 'Salesforce access token.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextInstanceUrl}}':
        - set:
            name: toProvision.salesforceNextInstanceUrl
            value: {value: '', description: 'Salesforce instance URL.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthScopes}}':
        - set:
            name: toProvision.salesforceNextOAuthScopes
            value: {value: '', description: 'Salesforce OAuth scopes.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextApiVersion}}':
        - set:
            name: toProvision.salesforceNextApiVersion
            value: {value: '', description: 'Salesforce REST API version.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthAuthorizeUrl}}':
        - set:
            name: toProvision.salesforceNextOAuthAuthorizeUrl
            value: {value: '', description: 'Salesforce OAuth authorize URL.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthTokenUrl}}':
        - set:
            name: toProvision.salesforceNextOAuthTokenUrl
            value: {value: '', description: 'Salesforce OAuth token URL.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextOAuthRevokeUrl}}':
        - set:
            name: toProvision.salesforceNextOAuthRevokeUrl
            value: {value: '', description: 'Salesforce OAuth revoke URL.'}
        - set: {name: provisionCount, value: '{% {{provisionCount}} + 1 %}'}
  - conditions:
      '!{{existingSecrets.salesforceNextAuthorizedAgents}}':
        - set:
            name: toProvision.salesforceNextAuthorizedAgents
            value:
              value: ''
              description: 'Comma-separated agentIds authorized to call this connector''s MCP endpoint. Managed by the config app.'
        - set:
            name: provisionCount
            value: '{% {{provisionCount}} + 1 %}'
  - conditions:
      '{{provisionCount}} > 0':
        - fetch:
            url: '{{secretsUrl}}'
            method: PATCH
            headers:
              Authorization: Bearer {{wsJwt.jwt}}
              Content-Type: application/json
            body: '{{toProvision}}'
            output: provisionResp
            outputMode: detailed_response
            emitErrors: false
        - emit:
            event: salesforce.onInstall.secretsProvisioned
            payload:
              status: '{{provisionResp.status}}'
              count: '{{provisionCount}}'
  - comment: >-
      Binding B — tenant workspace config.value maps each config key onto its
      secret (a secret reference only resolves inside config.value). Literals
      built via Custom Code. PATCH /config replaces `value`, so GET first + merge.
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextAuthMode}, output: secretRefAuthMode}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextLoginHost}, output: secretRefLoginHost}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextJwtUsername}, output: secretRefJwtUsername}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthClientId}, output: secretRefOAuthClientId}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthClientSecret}, output: secretRefOAuthClientSecret}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextJwtPrivateKey}, output: secretRefJwtPrivateKey}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextAccessToken}, output: secretRefAccessToken}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextInstanceUrl}, output: secretRefInstanceUrl}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthScopes}, output: secretRefOAuthScopes}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextApiVersion}, output: secretRefApiVersion}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthAuthorizeUrl}, output: secretRefOAuthAuthorizeUrl}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthTokenUrl}, output: secretRefOAuthTokenUrl}
  - Custom Code.run: {function: makeSecretRef, parameters: {key: salesforceNextOAuthRevokeUrl}, output: secretRefOAuthRevokeUrl}
  - Custom Code.run:
      function: makeSecretRef
      parameters:
        key: salesforceNextAuthorizedAgents
      output: secretRefAllowlist
  - set:
      name: configUrl
      value: '{{global.apiUrl}}/workspaces/{{wsInfo.id}}/config'
  - fetch:
      url: '{{configUrl}}'
      method: GET
      headers:
        Authorization: Bearer {{wsJwt.jwt}}
      output: curWsConfig
      outputMode: body
      emitErrors: false
  - set:
      name: newWsValue
      value: '{{curWsConfig.value}}'
  - set: {name: newWsValue.salesforceNextAuthMode, value: '{{secretRefAuthMode}}'}
  - set: {name: newWsValue.salesforceNextLoginHost, value: '{{secretRefLoginHost}}'}
  - set: {name: newWsValue.salesforceNextJwtUsername, value: '{{secretRefJwtUsername}}'}
  - set: {name: newWsValue.salesforceNextOAuthClientId, value: '{{secretRefOAuthClientId}}'}
  - set: {name: newWsValue.salesforceNextOAuthClientSecret, value: '{{secretRefOAuthClientSecret}}'}
  - set: {name: newWsValue.salesforceNextJwtPrivateKey, value: '{{secretRefJwtPrivateKey}}'}
  - set: {name: newWsValue.salesforceNextAccessToken, value: '{{secretRefAccessToken}}'}
  - set: {name: newWsValue.salesforceNextInstanceUrl, value: '{{secretRefInstanceUrl}}'}
  - set: {name: newWsValue.salesforceNextOAuthScopes, value: '{{secretRefOAuthScopes}}'}
  - set: {name: newWsValue.salesforceNextApiVersion, value: '{{secretRefApiVersion}}'}
  - set: {name: newWsValue.salesforceNextOAuthAuthorizeUrl, value: '{{secretRefOAuthAuthorizeUrl}}'}
  - set: {name: newWsValue.salesforceNextOAuthTokenUrl, value: '{{secretRefOAuthTokenUrl}}'}
  - set: {name: newWsValue.salesforceNextOAuthRevokeUrl, value: '{{secretRefOAuthRevokeUrl}}'}
  - set:
      name: newWsValue.salesforceNextAuthorizedAgents
      value: '{{secretRefAllowlist}}'
  - fetch:
      url: '{{configUrl}}'
      method: PATCH
      headers:
        Authorization: Bearer {{wsJwt.jwt}}
        Content-Type: application/json
      body:
        value: '{{newWsValue}}'
      output: wsConfigResp
      outputMode: detailed_response
      emitErrors: false
  - emit:
      event: salesforce.onInstall.completed
      payload:
        secretsProvisioned: '{{provisionCount}}'
  - comment: >-
      Binding A (terminal merge) — instance config keys point at the tenant
      workspace config.value (binding B). `set: config` merge is terminal — keep last.
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextAuthMode}, output: bindingAuthMode}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextLoginHost}, output: bindingLoginHost}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextJwtUsername}, output: bindingJwtUsername}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthClientId}, output: bindingOAuthClientId}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthClientSecret}, output: bindingOAuthClientSecret}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextJwtPrivateKey}, output: bindingJwtPrivateKey}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextAccessToken}, output: bindingAccessToken}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextInstanceUrl}, output: bindingInstanceUrl}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthScopes}, output: bindingOAuthScopes}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextApiVersion}, output: bindingApiVersion}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthAuthorizeUrl}, output: bindingOAuthAuthorizeUrl}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthTokenUrl}, output: bindingOAuthTokenUrl}
  - Custom Code.run: {function: makeConfigRef, parameters: {key: salesforceNextOAuthRevokeUrl}, output: bindingOAuthRevokeUrl}
  - Custom Code.run:
      function: makeConfigRef
      parameters:
        key: salesforceNextAuthorizedAgents
      output: bindingAllowlist
  - set:
      name: config
      type: merge
      value:
        configAppUrl: '{{configAppUrl}}'
        oauthCallbackUrl: '{{oauthCallbackUrl}}'
        authMode: '{{bindingAuthMode}}'
        loginHost: '{{bindingLoginHost}}'
        jwtUsername: '{{bindingJwtUsername}}'
        oauthClientId: '{{bindingOAuthClientId}}'
        oauthClientSecret: '{{bindingOAuthClientSecret}}'
        jwtPrivateKey: '{{bindingJwtPrivateKey}}'
        accessToken: '{{bindingAccessToken}}'
        instanceUrl: '{{bindingInstanceUrl}}'
        oauthScopes: '{{bindingOAuthScopes}}'
        apiVersion: '{{bindingApiVersion}}'
        oauthAuthorizeUrl: '{{bindingOAuthAuthorizeUrl}}'
        oauthTokenUrl: '{{bindingOAuthTokenUrl}}'
        oauthRevokeUrl: '{{bindingOAuthRevokeUrl}}'
        authorizedAgents: '{{bindingAllowlist}}'
output: '{{configAppUrl}}'
