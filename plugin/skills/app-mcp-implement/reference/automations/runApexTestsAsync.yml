slug: runApexTestsAsync
name: runApexTestsAsync
description: Schedule async Apex test execution (POST /tooling/runTestsAsynchronous). Calls the Salesforce REST API via the resolved per-user OAuth session (or JWT Bearer fallback). Public App-mode automation — tenants call `Salesforce.runApexTestsAsync:` directly from their own automations.
arguments:
  classNames:
    type: string
    description: Comma-separated Apex test class names.
  classids:
    type: string
    description: Comma-separated Apex test class IDs.
  suiteNames:
    type: string
    description: Comma-separated test suite names.
  suiteids:
    type: string
    description: Comma-separated test suite IDs.
  maxFailedTests:
    type: number
    description: Stop the run after this many failures; -1 means no limit.
  testLevel:
    type: string
    description: Which tests run.
    enum:
    - RunSpecifiedTests
    - RunLocalTests
    - RunAllTestsInOrg
  tests:
    type: array
    description: Test classes to run, optionally limited to some methods.
    items:
      type: object
      additionalProperties: true
      properties:
        className:
          type: string
        classId:
          type: string
        testMethods:
          type: array
          items:
            type: string
do:
  - buildAppAuth:
      output: auth
  - conditions:
      '{{auth.error}}':
        - set:
            name: result
            value:
              error: '{{auth.error}}'
        - break: {}
  - set:
      name: methodArgs
      value:
        classNames: '{{classNames}}'
        classids: '{{classids}}'
        suiteNames: '{{suiteNames}}'
        suiteids: '{{suiteids}}'
        maxFailedTests: '{{maxFailedTests}}'
        testLevel: '{{testLevel}}'
        tests: '{{tests}}'
  - methodRestOp:
      operationName: runApexTestsAsync
      args: '{{methodArgs}}'
      accessToken: '{{auth.accessToken}}'
      baseUrl: '{{auth.baseUrl}}'
      output: apiResult
  - conditions:
      '!{{apiResult.success}}':
        - set:
            name: result
            value:
              error: '{{apiResult.error}}'
        - break: {}
  - set:
      name: result
      value: '{{apiResult.data}}'
output: '{{result}}'
