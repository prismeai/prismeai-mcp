slug: setOAuthClient
name: 00_Maintainer/setOAuthClient
description: 'MAINTAINER setup — stores the central platform Google OAuth client as five separate secrets, one plain value per key, used as fallback by every tenant that does not provide its own client. Reads clientId / clientSecret / scopes / authorizeUrl / tokenUrl from the HTTP body (maintainer view of the config SPA, opened from the core workspace Builder) or top-level args (Studio Test). Each `config.value.centralOAuth*` static binding in index.yml resolves the matching secret for resolveOAuthClient. Gated: authenticated user + workspace owner/editor role when exposed by the runtime.'
private: true
arguments:
  clientId:
    type: string
  clientSecret:
    type: string
    secret: true
  scopes:
    type: string
  authorizeUrl:
    type: string
  tokenUrl:
    type: string
when:
  endpoint: true
do:
  - conditions:
      '!{{user.id}}':
        - set:
            name: $http
            value:
              status: 401
        - set:
            name: output
            value:
              error: Authentication required (workspace editor).
        - break: {}
  - comment: 'Role gate — FAIL-CLOSED: the secret PATCH below runs with a privileged workspace JWT (auth: workspace: true), so the caller''s own RBAC is NOT re-checked there. user.role is the caller''s role ON THIS workspace (runtime contexts/factory.ts getLoadedSubjectRole) — absent for non-members, who must be rejected.'
  - conditions:
      '{{user.role}} != "owner" && {{user.role}} != "editor" && {{user.role}} != "admin" && {{user.platformRole}} != "superadmin"':
        - set:
            name: $http
            value:
              status: 403
        - set:
            name: output
            value:
              error: Forbidden — you must be an editor of the core workspace.
        - break: {}
  - set:
      name: cid
      value: '{% {{body.clientId}} || {{clientId}} %}'
  - set:
      name: csec
      value: '{% {{body.clientSecret}} || {{clientSecret}} %}'
  - set:
      name: csco
      value: '{% {{body.scopes}} || {{scopes}} %}'
  - set:
      name: cauth
      value: '{% {{body.authorizeUrl}} || {{authorizeUrl}} %}'
  - set:
      name: ctok
      value: '{% {{body.tokenUrl}} || {{tokenUrl}} %}'
  - conditions:
      '!{{cid}} || !{{csec}} || !{{csco}} || !{{cauth}} || !{{ctok}}':
        - set:
            name: $http
            value:
              status: 400
        - set:
            name: output
            value:
              error: clientId, clientSecret, scopes, authorizeUrl and tokenUrl are required.
        - break: {}
  - auth:
      workspace: true
      output: wsAuth
  - comment: One secret key per field, each holding a single plain value — never an aggregate client object. The config.value.centralOAuth* bindings in index.yml resolve them. Secrets survive push_workspace, unlike runtime config.value writes.
  - fetch:
      url: '{{global.apiUrl}}/workspaces/{{global.workspaceId}}/security/secrets'
      method: PATCH
      headers:
        Authorization: Bearer {{wsAuth.jwt}}
        Content-Type: application/json
      body:
        googleWorkspacesCentralOAuthClientId:
          value: '{{cid}}'
        googleWorkspacesCentralOAuthClientSecret:
          value: '{{csec}}'
        googleWorkspacesCentralOAuthScopes:
          value: '{{csco}}'
        googleWorkspacesCentralOAuthAuthorizeUrl:
          value: '{{cauth}}'
        googleWorkspacesCentralOAuthTokenUrl:
          value: '{{ctok}}'
      output: patchResp
      outputMode: detailed_response
      emitErrors: false
  - conditions:
      '{{patchResp.status}} >= 300':
        - set:
            name: $http
            value:
              status: 500
        - set:
            name: output
            value:
              error: Failed to store the central OAuth client ({{patchResp.status}}).
        - break: {}
  - set:
      name: output
      value:
        ok: true
        message: Central Google OAuth client stored.
output: '{{output}}'
