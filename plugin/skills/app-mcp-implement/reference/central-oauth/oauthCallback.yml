slug: oauthCallback
name: OAuth/oauthCallback
description: 'OAuth2 authorization-code callback — dual role. (1) PROXY (core workspace, central client): when the state packs a tenant callback other than this instance''s, redirect code+state verbatim to that tenant callback (validated against our own api host — no open redirect). (2) EXCHANGE (tenant instance, or core for its own connect): reads the pending PKCE verifier from the user-scoped secret named after the state''s nonce (single use), exchanges the code (client via resolveOAuthClient + that verifier + oc.redirectUri), stores the tokens in user-scoped secrets (access + refresh, fingerprinted names) plus a best-effort workspace mirror of the refresh token for cron, then redirects (meta-refresh, CSP-safe) to the config SPA callback view. No token and no pending sign-in in the user context. Credential-bearing fetch failures are not emitted. Pattern of google-workspaces `oauthCallback`.'
private: true
when:
  endpoint: true
schemas:
  - output:
      redact: true
do:
  - set:
      name: $http
      value:
        headers:
          Content-Type: text/html
  - set:
      name: spaBase
      value: '{{global.studioUrl}}/apps/<slug>?view=oauthCallback'
  - set:
      name: redirectTo
      value: '{{spaBase}}&status=error&message=unknown'
  - conditions:
      '{{query.error}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message={{query.error}}'
        - break: {}
  - conditions:
      '!{{query.code}} || !{{query.state}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=invalid_state'
        - break: {}
  - comment: 'PROXY role — the state packs a tenant callback that is not this one (central-client flow landing on the core): forward code+state verbatim to that tenant callback, where the pending sign-in lives. unpackOAuthState only returns a redirectUrl for oauthCallback webhooks on our own api host. The tenant then sees its own callback packed in the state (`isSelf`) and exchanges.'
  - Custom Code.run:
      function: unpackOAuthState
      parameters:
        state: '{{query.state}}'
        code: '{{query.code}}'
        apiUrl: '{{global.apiUrl}}'
        selfCallbackUrl: '{{config.oauthCallbackUrl}}'
      output: up
  - conditions:
      '{{up.redirectUrl}} and !{{up.isSelf}}':
        - set:
            name: redirectTo
            value: '{{up.redirectUrl}}'
        - break: {}
  - comment: EXCHANGE role. The pending sign-in is a user-scoped secret named after the nonce in the state (see oauthConnect) — read the same way by every worker, and only by the user who started it. It comes back as an opaque `$secret:` ref, resolved by the token fetch itself.
  - Custom Code.run:
      function: parseOAuthPending
      parameters:
        state: '{{query.state}}'
      output: parsed
  - Custom Code.run:
      function: makePendingSecretName
      parameters:
        nonce: '{{parsed.nonce}}'
      output: _pendingRef
  - conditions:
      '!{{user.id}} or {{parsed.error}} or {{_pendingRef.error}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=invalid_state'
        - break: {}
  - try:
      do:
        - run:
            module: secrets
            function: get
            parameters:
              name: '{{_pendingRef.name}}'
              scope: user
            output: _verifier
      catch:
        - set:
            name: _verifier
            value: ''
  - set:
      name: _verifierOk
      value: false
  - conditions:
      '{{_verifier}} matches "$secret:"':
        - set:
            name: _verifierOk
            value: true
  - conditions:
      '!{{_verifierOk}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=invalid_state'
        - break: {}
  - resolveOAuthClient:
      output: oc
  - conditions:
      '{{oc.error}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=oauth_client_not_configured'
        - break: {}
  - Custom Code.run:
      function: makeTokenCacheKey
      parameters:
        tenantId: '{{global.workspaceId}}'
        clientId: '{{oc.oauthClientId}}'
        scopes: '{{oc.scopes}}'
      output: tokenCache
  - Custom Code.run:
      function: makeTokenSecretName
      parameters:
        userId: '{{user.id}}'
        cacheKey: '{{tokenCache.key}}'
      output: tokName
  - conditions:
      '{{tokenCache.error}} or {{tokName.error}}':
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=invalid_oauth_cache_context'
        - break: {}
  - comment: 'oc.tokenUrl = the provider direct (tenant client / core context) or the core centralTokenExchange proxy (tenant on the central client — the proxy injects the central client_id/secret, the empty creds below are ignored).'
  - fetch:
      url: '{{oc.tokenUrl}}'
      method: POST
      headers:
        Content-Type: application/x-www-form-urlencoded
      body:
        grant_type: authorization_code
        code: '{{query.code}}'
        client_id: '{{oc.oauthClientId}}'
        client_secret: '{{oc.oauthClientSecret}}'
        redirect_uri: '{{oc.redirectUri}}'
        code_verifier: '{{_verifier}}'
      output: tokenResp
      outputMode: detailed_response
      emitErrors: false
  - comment: Single use — a code can be exchanged once, so its pending sign-in goes as soon as the exchange has run, whatever the answer. Every catch reads `$error`; `error` is not set there.
  - try:
      do:
        - run:
            module: secrets
            function: delete
            parameters:
              name: '{{_pendingRef.name}}'
              scope: user
      catch:
        - set:
            name: _pendingDelErr
            value: '{{$error.message}}'
  - conditions:
      '{{tokenResp.status}} != 200':
        - comment: Only the provider's error code and description go to the Activity Feed for diagnosis — never the body. Only a symbolic code reaches the page.
        - emit:
            event: error
            payload:
              error: OAuthTokenExchangeFailed
              message: OAuth authorization code exchange failed
              details:
                stage: oauthCallback
                status: '{{tokenResp.status}}'
                providerError: '{{tokenResp.body.error}}'
                providerErrorDescription: '{{tokenResp.body.error_description}}'
        - set:
            name: redirectTo
            value: '{{spaBase}}&status=error&message=token_exchange_rejected'
        - break: {}
  - comment: Seed the access-token secret buildAppAuth reads first; overwriting it keeps a reconnection — possibly to another account — from being served the previous connection's token.
  - try:
      do:
        - run:
            module: secrets
            function: set
            parameters:
              name: '{{tokName.accessName}}'
              scope: user
              value: '{{tokenResp.body.access_token}}'
      catch:
        - set:
            name: _atUserErr
            value: '{{$error.message}}'
  - comment: Providers return a refresh token on first consent / prompt=consent only — when absent, the stored one stays.
  - conditions:
      '{{tokenResp.body.refresh_token}}':
        - set:
            name: _rtSaved
            value: false
        - try:
            do:
              - run:
                  module: secrets
                  function: set
                  parameters:
                    name: '{{tokName.name}}'
                    scope: user
                    value: '{{tokenResp.body.refresh_token}}'
              - set:
                  name: _rtSaved
                  value: true
            catch:
              - set:
                  name: _rtUserErr
                  value: '{{$error.message}}'
        - conditions:
            '!{{_rtSaved}}':
              - set:
                  name: redirectTo
                  value: '{{spaBase}}&status=error&message=token_store_failed'
              - break: {}
        - comment: Best-effort workspace mirror for cron (buildAppAuth targetUserId), written under the member rule of security.yml. An RBAC denial MUST NOT abort the callback.
        - try:
            do:
              - run:
                  module: secrets
                  function: set
                  parameters:
                    name: '{{tokName.name}}'
                    scope: workspace
                    value: '{{tokenResp.body.refresh_token}}'
                  output: tokSetResp
              - conditions:
                  '{{tokSetResp.error}}':
                    - emit:
                        event: error
                        payload:
                          error: OAuthCronTokenPersistFailed
                          message: Connected, but the per-user refresh token could not be stored as a workspace secret — scheduled runs for this user will fail.
                          details:
                            reason: '{{tokSetResp.error}}'
                            detail: '{{tokSetResp.message}}'
            catch:
              - set:
                  name: tokSetResp
                  value:
                    error: '{{$error.error}}'
                    message: '{{$error.message}}'
  - comment: Non-credential metadata only (shown by oauthStatus / the config app).
  - set:
      name: user.<camel>.oauth
      scope: user
      value:
        scopes: '{{oc.scopes}}'
        connectedAt: '{{run.date}}'
  - set:
      name: redirectTo
      value: '{{spaBase}}&status=connected'
output: |
  <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url={% sanitize({{redirectTo}}) %}"><title>OAuth</title></head><body style="font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:48px">Redirecting… <a href="{% sanitize({{redirectTo}}) %}">continue</a></body></html>
