slug: centralTokenExchange
name: 00_Maintainer/centralTokenExchange
description: 'CORE webhook — token endpoint proxy for the central platform OAuth client. The provider token URL is read from its own central secret alongside the client credentials. Injects client_id/client_secret server-side and never logs or emits the request.'
private: true
when:
  endpoint: true
do:
  - comment: >-
      Unresolved {{secret.X}} bindings are truthy literals (Gotcha 26); resolve
      them in plain JS so an unconfigured core fails closed with 400 instead of
      POSTing a literal client_secret to the provider.
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthClientId}}'}, output: cId}
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthClientSecret}}'}, output: cSecret}
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthTokenUrl}}'}, output: cTokenUrl}
  - conditions:
      '!{{cId.resolved}} || !{{cSecret.resolved}} || !{{cTokenUrl.resolved}}':
        - set:
            name: $http
            value:
              status: 400
        - set:
            name: output
            value:
              error: central_client_not_configured
        - break: {}
  - conditions:
      '{{body.grant_type}} != "authorization_code" && {{body.grant_type}} != "refresh_token"':
        - set:
            name: $http
            value:
              status: 400
        - set:
            name: output
            value:
              error: unsupported_grant_type
        - break: {}
  - conditions:
      '{{body.grant_type}} == "authorization_code"':
        - set:
            name: tokenBody
            value:
              grant_type: authorization_code
              code: '{{body.code}}'
              code_verifier: '{{body.code_verifier}}'
              redirect_uri: '{{body.redirect_uri}}'
              client_id: '{{cId.value}}'
              client_secret: '{{cSecret.value}}'
      default:
        - set:
            name: tokenBody
            value:
              grant_type: refresh_token
              refresh_token: '{{body.refresh_token}}'
              client_id: '{{cId.value}}'
              client_secret: '{{cSecret.value}}'
  - comment: 'emitErrors: false is MANDATORY here — a failing fetch emits runtime.fetch.failed with the request body, which would leak client_secret into the activity feed.'
  - fetch:
      url: '{{cTokenUrl.value}}'
      method: POST
      headers:
        Content-Type: application/x-www-form-urlencoded
      body: '{{tokenBody}}'
      output: tokenResp
      outputMode: detailed_response
      emitErrors: false
  - set:
      name: $http
      value:
        status: '{{tokenResp.status}}'
  - set:
      name: output
      value: '{{tokenResp.body}}'
output: '{{output}}'
