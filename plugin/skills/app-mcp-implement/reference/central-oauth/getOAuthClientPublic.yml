slug: getOAuthClientPublic
name: 00_Maintainer/getOAuthClientPublic
description: 'CORE webhook — returns the PUBLIC part of the central platform OAuth client ({ configured, clientId, scopes, authorizeUrl }), never the secret. Called at runtime by resolveOAuthClient from tenant app-instance contexts (the core secrets `googleWorkspacesCentralOAuth*` only resolve in the core workspace context — secret refs interpolate against the RUNNING workspace''s store, so tenants cannot read them through config inheritance). The client secret stays on the core: token operations go through centralTokenExchange.'
private: true
when:
  endpoint: true
do:
  - conditions:
      '{{config.centralOAuthClientId}} && {{config.centralOAuthClientSecret}}':
        - set:
            name: output
            value:
              configured: true
              clientId: '{{config.centralOAuthClientId}}'
              scopes: '{{config.centralOAuthScopes}}'
              authorizeUrl: '{{config.centralOAuthAuthorizeUrl}}'
        - break: {}
  - set:
      name: output
      value:
        configured: false
output: '{{output}}'
