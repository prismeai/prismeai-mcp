slug: getOAuthClientPublic
name: 00_Maintainer/getOAuthClientPublic
description: 'CORE webhook — returns the public part of the central platform OAuth client ({ configured, clientId, scopes }). The client secret stays on the core; token operations go through centralTokenExchange.'
private: true
when:
  endpoint: true
do:
  - conditions:
      '{{config.centralOAuthClientId}} && {{config.centralOAuthClientSecret}}':
        - set:
            name: output
            value:
              configured: true
              clientId: '{{config.centralOAuthClientId}}'
              scopes: '{{config.centralOAuthScopes}}'
        - break: {}
  - set:
      name: output
      value:
        configured: false
output: '{{output}}'
