slug: maintainerStatus
name: 00_Maintainer/maintainerStatus
description: 'CORE webhook — tells the config SPA maintainer view whether the current caller is allowed to configure the central OAuth client. Authoritative gate mirroring setOAuthClient: authenticated user whose role on THIS core workspace is owner/editor/admin (runtime contexts/factory.ts getLoadedSubjectRole; absent for non-members). The GET /security/secrets endpoint CANNOT be used for this — accessManager.findAll returns an empty 200 {} for non-privileged users instead of 403, indistinguishable from a not-yet-configured maintainer. Returns only the boolean(s) + the public clientId/scopes (never the secret), so the SPA can both gate the form and prefill it.'
private: true
when:
  endpoint: true
do:
  - set:
      name: allowed
      value: false
  - conditions:
      '{{user.id}} && ({{user.role}} = "owner" || {{user.role}} = "editor" || {{user.role}} = "admin" || {{user.platformRole}} = "superadmin")':
        - set:
            name: allowed
            value: true
  - comment: >-
      Public client fields for prefill. The client secret is not returned.
      Before setOAuthClient has run the bindings are UNRESOLVED literals —
      non-empty and therefore TRUTHY (Gotcha 26) — which would report
      configured:true and prefill the form with "{{secret...}}". resolvedSecret
      normalises them to '' in plain JS first.
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthClientId}}'}, output: cId}
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthClientSecret}}'}, output: cSecret}
  - Custom Code.run: {function: resolvedSecret, parameters: {value: '{{config.centralOAuthScopes}}'}, output: cScopes}
  - set:
      name: output
      value:
        allowed: '{{allowed}}'
        authenticated: '{% {{user.id}} && true %}'
        configured: '{% {{allowed}} && {{cId.resolved}} && {{cSecret.resolved}} && true %}'
        clientId: '{% {{allowed}} && {{cId.value}} %}'
        scopes: '{% {{allowed}} && {{cScopes.value}} %}'
output: '{{output}}'
