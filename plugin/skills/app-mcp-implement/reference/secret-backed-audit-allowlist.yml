# Exact, reviewed exceptions for the canonical reference.
# Provider/tenant/client/environment configuration is never allowed here.
exceptions:
  - path: index.yml
    pattern: '^config\.value\.bundles\.'
    justification: Bundle URL/name/version are structural deployment pointers and metadata explicitly allowed by the skill.
  - path: index.yml
    pattern: '^https://api\.sandbox\.prisme\.ai/v2/files/'
    justification: Published logo and bundle file pointers are structural app assets, not provider/tenant configuration.
  - path: pages/salesforce-next/.env.example
    pattern: 'https://(?:api|app)\.acme\.example\.com'
    justification: Reserved example-domain UX documentation; it is blank at runtime and never used as a fallback.
  - path: pages/salesforce-next/.env.example
    pattern: 'https://api\.sandbox\.prisme\.ai/v2'
    justification: Documentation of the public platform API endpoint; the actual deployment value is supplied through an unversioned environment secret.
  - path: pages/salesforce-next/src/App.tsx
    pattern: 'https://(?:login|myorg\.my)\.salesforce\.com'
    justification: Non-secret UX placeholder illustrating the expected URL syntax; never consumed as a runtime default.
  - path: pages/salesforce-next/src/App.tsx
    pattern: '^api refresh_token offline_access$'
    justification: UX placeholder showing scope syntax; the runtime value is always loaded from the auth secret.
  - path: pages/salesforce-next/src/lib/i18n.ts
    pattern: 'https://myorg\.my\.salesforce\.com'
    justification: Reserved UX example hostname; never consumed as runtime configuration.
  - path: pages/salesforce-next/src/lib/i18n.ts
    pattern: '^api refresh_token offline_access$'
    justification: Explanatory UX text only; it is not a runtime default and users save the selected scopes to the secret.
  - path: pages/salesforce-next/src/lib/utils.ts
    pattern: 'https?://'
    justification: Universal URL-scheme transformation used to derive the Prisme API host from the runtime host, not an external resource.
  - path: pages/salesforce-next/src/CatalogPublish.tsx
    pattern: 'context_id,agent_id,user_id'
    justification: Universal Prisme MCP capability protocol scope, not an OAuth/provider scope.
  - path: pages/salesforce-next/src/App.tsx
    pattern: 'context_id,agent_id,user_id'
    justification: Universal Prisme MCP capability protocol scope, not an OAuth/provider scope.
  - path: pages/salesforce-next/README.md
    pattern: 'https?://(?:api|app)\.(?:acme\.)?example\.com|http://localhost:5173'
    justification: Reserved example domains and local development URL used only in SPA tooling documentation.
  - path: pages/salesforce-next/README.md
    pattern: 'https://github\.com/|https://api\.sandbox\.prisme\.ai'
    justification: Public source/platform documentation links; they are not consumed by connector runtime configuration.
  - path: pages/salesforce-next/AGENTS.md
    pattern: 'https://api\.sandbox\.prisme\.ai/v2'
    justification: Public platform documentation example; deployment still requires an unversioned environment secret.
  - path: pages/salesforce-next/scripts/deploy.mjs
    pattern: 'https://(?:api|app)\.acme\.com'
    justification: Reserved example-domain comments documenting environment-variable syntax; never used at runtime.
