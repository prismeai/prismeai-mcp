authorizations:
  roles:
    # Assumed by buildAppAuth to resolve a member's token when nobody drives the
    # run. Never grant it to a person and never give it an `auth` block: anything
    # holding it reads and overwrites every credential in the family below.
    tokenResolver: {}
    tokenDepositor: {}
    editor: {}
    viewer: {}
    workspace:
      auth:
        apiKey: {}
  rules:
    - role: editor
      action:
        - read
        - get_usage
        - aggregate_search
        - update
      subject: workspaces
    - role: viewer
      action: read
      subject:
        - workspaces
        - pages
    - role: viewer
      action: read
      subject:
        - events
      conditions:
        source.sessionId: '{{session.id}}'
    - role: viewer
      action: read
      subject:
        - events
      conditions:
        source.userId: '{{user.id}}'
    - role: editor
      action: manage
      subject: files
    - role: editor
      action:
        - read
        - update
      subject: pages
    - role: editor
      action:
        - read
        - update
      subject: apps
    - role: editor
      action:
        - read
        - create
      subject: events
    - role: editor
      inverted: true
      action: read
      subject: events
      conditions:
        type:
          $regex: ^apikeys\.*$
    - action: create
      subject: events
      reason: Anyone can create any events
      conditions:
        source.serviceTopic: topic:runtime:emit
    - action: read
      subject: events
      conditions:
        source.serviceTopic: topic:runtime:emit
        source.sessionId: '{{session.id}}'
      reason: Anyone can read any events from its own session
    - action: create
      subject: files
      conditions:
        mimetype:
          $regex: ^(.*)$
      reason: Anyone can upload any file
    - role: workspace
      action:
        - read
        - aggregate_search
      subject:
        - workspaces
        - events
        - automations
        - pages
        - files
    - role: workspace
      action:
        - create
        - update
        - delete
      subject:
        - files
    - action: read
      subject: pages
      conditions:
        labels:
          $in:
            - public
    - action:
        - create
        - update
      subject: secure_secrets
      conditions:
        name:
          $regex: '^<pfx>Refresh_[a-f0-9]{24}_${user.id}$'
      reason: |
        A member connecting their own account deposits the refresh token that a
        scheduled run will later replay. The name carries the 24-hex config
        fingerprint of makeTokenSecretName: one fixed-width class, BEFORE
        `${user.id}`, as the platform requires.
    - role: tokenDepositor
      action:
        - read
        - create
        - update
        - delete
      subject: secure_secrets
      conditions:
        name:
          $regex: '^<pfx>Refresh_[a-f0-9]{24}_${user.id}$'
      reason: |
        A connecting member storing, rotating and removing their own workspace
        mirror, from an app instance. Assumed for one call by the automation
        doing it (oauthCallback, buildAppAuth, oauthDisconnect); bound to the
        acting user by the name, and never granted to a person. In an installed
        app, this file is not read: the same rule goes to `requiredAuthorizations`
        in index.yml, and the platform stores the secret as
        `app:<source workspace id>:<name>` — the name tokenResolver reads.
    - role: tokenResolver
      action:
        - read
        - create
        - update
        - delete
      subject: secure_secrets
      conditions:
        name:
          $regex: '^<pfx>Refresh_'
      reason: |
        The same credentials, resolved for a member who is not there. Names the
        FAMILY rather than one person: `${user.id}` binds to nobody in a run
        nobody drives. The write is here too because providers rotate refresh
        tokens, and the new one must be stored for that absent member. `update`
        also covers `secrets.acquireRenewal` / `releaseRenewal` (holding the
        renewal lease means writing the secret next). `delete` drops a token
        the provider refused for good (invalid_grant) — a member rule can never
        grant it.
