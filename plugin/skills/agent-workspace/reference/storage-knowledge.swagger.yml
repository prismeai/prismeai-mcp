        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /v1/knowledge_bases/{knowledgeBaseId}/api-keys:
    parameters:
    - name: knowledgeBaseId
      in: path
      required: true
      schema:
        type: string
        pattern: ^vs_[A-Za-z0-9-]+$
        maxLength: 128
      description: Knowledge base id. Legacy physical prefix `vs_` (the `kb_` rename is deferred).
    post:
      operationId: createKnowledgeBaseApiKey
      tags:
      - API Keys
      summary: Mint an API key
      description: |
        Creates an API key (minted scope `storage:vector_stores:{id}` -
        the `knowledge_bases` rename is deferred with the platform
        allowlist). The secret is returned ONCE in this response and
        never again. `expires_at` is **required** - the platform key
        service rejects a key with no expiry. Requires `admin`+ (or owner).
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expires_at
              properties:
                name:
                  type: string
                  maxLength: 256
                slug:
                  type: string
                  description: |
                    Optional path-safe id. Auto-generated as
                    `kb-{knowledge_base_id}-{uuid}` when omitted.
                permissions:
                  type: array
                  items:
                    type: string
                  description: |
                    Optional `storage:`-prefixed permission strings.
                    Falls back to `config.api_key_default_permissions`.
                expires_at:
                  type: integer
                  description: Unix seconds. **Required.**
      responses:
        '201':
          description: Key created; `secret` present (once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    get:
      operationId: listKnowledgeBaseApiKeys
      tags:
      - API Keys
      summary: List API keys
      description: Secrets are never included. Requires `admin`+ (or owner).
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated API keys (no secrets).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /v1/knowledge_bases/{knowledgeBaseId}/api-keys/{apiKeyId}:
    parameters:
    - name: knowledgeBaseId
      in: path
      required: true
      schema:
        type: string
        pattern: ^vs_[A-Za-z0-9-]+$
        maxLength: 128
      description: Knowledge base id. Legacy physical prefix `vs_` (the `kb_` rename is deferred).
    - name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        pattern: ^kb-[A-Za-z0-9_-]+$
        maxLength: 128
      description: |
        Knowledge-base API key identifier - the key **slug**
        (auto-generated as `kb-{knowledge_base_id}-{uuid}`, or
        caller-supplied). This is the value returned as `ApiKey.id`.
    delete:
      operationId: deleteKnowledgeBaseApiKey
      tags:
      - API Keys
      summary: Revoke an API key
      description: Requires `admin`+ (or owner).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - object
                - deleted
                properties:
                  object:
                    type: string
                    enum:
                    - knowledge_base.api_key
                  deleted:
                    type: boolean
                    enum:
                    - true
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /v1/knowledge_bases/{knowledgeBaseId}/api-keys/{apiKeyId}/rotate:
    parameters:
    - name: knowledgeBaseId
      in: path
      required: true
      schema:
        type: string
        pattern: ^vs_[A-Za-z0-9-]+$
        maxLength: 128
      description: Knowledge base id. Legacy physical prefix `vs_` (the `kb_` rename is deferred).
    - name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        pattern: ^kb-[A-Za-z0-9_-]+$
        maxLength: 128
      description: |
        Knowledge-base API key identifier - the key **slug**
        (auto-generated as `kb-{knowledge_base_id}-{uuid}`, or
        caller-supplied). This is the value returned as `ApiKey.id`.
    post:
      operationId: rotateKnowledgeBaseApiKey
      tags:
      - API Keys
      summary: Rotate an API key
      description: |
        Issues a new secret for the same key id and invalidates the
        previous secret. The new secret is returned ONCE. Requires
        `admin`+ (or owner).
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Rotated; new `secret` present (once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /v1/stats:
    get:
      operationId: getStats
      tags:
      - Stats
      summary: Dashboard stats
      description: |
        Aggregate totals for the caller's org scope (knowledge bases,
