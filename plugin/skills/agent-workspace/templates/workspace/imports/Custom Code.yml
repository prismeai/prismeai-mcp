slug: Custom Code
appSlug: Custom Code
config:
  disableNpmRegistry: true
  functions:
    agentConfig:
      language: nodejs
      parameters:
        op:
          type: string
          description: check | plan | report | summary
        live:
          type: object
          description: Live agent draft (Agents.getAgent with x-draft-mode), or null
        expected:
          type: object
          description: 'check / plan: the body _ensure-agent sends + visibility (+ profile); report: {body, visibility, profile, missing}'
        stored:
          type: object
          description: Data of the state row res:agentHash:<agent-key> ({hash, snapshot}), or null
        options:
          type: object
          description: 'check / plan: {skippedTools}; report: {includeInstructions, kbs [{id, key, name}], apiUrl}'
        data:
          type: object
          description: 'summary: the syncAll actions array'
      code: |
        /*
          agentConfig(op, live, expected, stored, options, data)
          Agent configuration fingerprint, drift decision, sync plan, instance description and sync
          summary (DESIGN 4.3, 4.6, 6.1). Pure: no I/O. Never throws: {error, message} on failure.
          op:
          - check: drift guard of _ensure-agent. live = the live agent draft (GET v1/agents/:id with
            x-draft-mode), expected = the body _ensure-agent sends + visibility, stored = the data of the
            state row res:agentHash:<key> ({hash, snapshot}) or null, options.skippedTools.
            Snapshot = the managed fields (description, instructions, model, temperature, visibility,
            tool_call_budget, token_budget, max_turns / max_tokens when the expected body sets them, skills
            and hooks when it carries an array, sub_agents, tools), normalised: tools and sub agents sorted
            by name, tool ids dropped, headers / auth / secret-like keys replaced by a hash, URL query values
            redacted. hash = sha256 of the snapshot (16 hex).
            Rule: live = expected -> in-sync; live = stored -> workspace-changed (update); otherwise drift,
            edited-outside-workspace with a stored hash, no-baseline without. A baseline stored before a
            field became managed is matched without that field, so managing a new field is no hand edit.
            A localized description ({"en": "..."} or that JSON as a string) is compared by its text;
            keepDescription = the live value when its text is the expected one (sent back unchanged).
            Returns {drift, reason, liveHash, expectedHash, storedHash, changes, summary, liveSnapshot,
            plan, keepDescription?}.
          - plan: live null -> creation plan {mode: create, create {...}}; live set -> the plan of check.
          - report: describeInstance entry of one agent. live (or null), expected {body, visibility,
            profile, missing} (or null), stored as above, options {includeInstructions, kbs [{id, key,
            name}], apiUrl}. Returns {live, published, expected, diff, syncAll {wouldDo, reason, summary,
            missing?}, externalTools}, redacted (secret-like keys, header values, token-like URL query
            values, Bearer / iak_ / sk- / JWT strings).
          - summary: data = syncAll actions -> {summary: one line per action, warnings: destructive
            sentences prefixed by the resource key, unbound / created knowledge bases, skipped documents,
            agents left in drift or failed}.
          plan shape (check and plan): {mode: update, same, fields [{field, from, to}], instructions
          {fromLength, toLength, addedLines, removedLines, lostSections, firstChanges}, tools {added,
          removed, replaced, changed}, skills {added, removed, changed}, subAgents {added, removed,
          changed}, kept (unmanaged live fields), skippedTools, destructive [sentences], counts}.
          Destructive: tool removed or replaced by another type, tool target changed, tool parameter
          dropped, sub agent removed, skill / hook removed, a limit lowered or removed, model changed,
          visibility changed, instructions shorter by more than 10 % or losing headings, an omitted tool
          that exists live.
        */
        const crypto = require('crypto');
        /* The functions sandbox has no global URL: take it from the url module. */
        const NodeURL = require('url').URL;
        try {
          const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
          const isEmpty = (v) => v === undefined || v === null || v === '' ||
            (Array.isArray(v) && !v.length) || (isObj(v) && !Object.keys(v).length);
          const stable = (v) => {
            if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
            if (isObj(v)) return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
            return JSON.stringify(v === undefined ? null : v);
          };
          const sha = (v) => crypto.createHash('sha256').update(typeof v === 'string' ? v : stable(v)).digest('hex').slice(0, 16);
          const num = (v) => {
            if (v === undefined || v === null || v === '') return null;
            const n = Number(v);
            return isFinite(n) ? n : String(v);
          };
          const str = (v) => (v === undefined || v === null ? null : (typeof v === 'string' ? v : stable(v)));
          const opts = isObj(options) ? options : {};

          /* ---- redaction ---- */
          const SECRET_KEY = /(secret|password|passwd|credential|cookie|authorization|api[-_]?key|apikey|private[-_]?key|token|signature)$/i;
          const SECRET_PARAM = /(token|key|sig|signature|secret|code|auth|password|passwd|credential|session|jwt|access)/i;
          const looksLikeToken = (s) => s.length >= 16 && /^[A-Za-z0-9._~+\/=:-]+$/.test(s) && /[0-9]/.test(s) && /[A-Za-z]/.test(s);
          const redactUrl = (s) => {
            if (!/^https?:\/\//i.test(s)) return s;
            let u;
            try { u = new NodeURL(s); } catch (e) { return s; }
            let changed = false;
            if (u.username || u.password) { u.username = 'REDACTED'; u.password = ''; changed = true; }
            const params = [];
            u.searchParams.forEach((v, k) => params.push([k, v]));
            if (params.length) {
              const q = params.map(([k, v]) => {
                if (SECRET_PARAM.test(k) || looksLikeToken(v)) { changed = true; return encodeURIComponent(k) + '=REDACTED'; }
                return encodeURIComponent(k) + '=' + encodeURIComponent(v);
              });
              if (changed) return u.origin + u.pathname + '?' + q.join('&') + (u.hash || '');
            }
            return changed ? u.toString() : s;
          };
          const redactString = (s) => {
            let out = s;
            out = out.replace(/https?:\/\/[^\s"'<>`)\]]+/gi, (m) => redactUrl(m));
            out = out.replace(/\bat:[A-Za-z0-9._\-]{8,}/g, 'at:REDACTED');
            out = out.replace(/\b(Bearer|Basic)\s+[A-Za-z0-9._~+\/=\-]{8,}/g, '$1 REDACTED');
            out = out.replace(/\biak_[A-Za-z0-9._\-]{6,}/g, 'iak_REDACTED');
            out = out.replace(/\bsk-[A-Za-z0-9_\-]{10,}/g, 'sk-REDACTED');
            out = out.replace(/\beyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}/g, 'JWT_REDACTED');
            out = out.replace(/([?&](?:token|access_token|api_key|apikey|key|sig|signature|code|secret|password)=)[^&\s"'<>]+/gi, '$1REDACTED');
            return out;
          };
          const redactDeep = (v, keyName) => {
            if (typeof v === 'string') {
              if (keyName && SECRET_KEY.test(keyName) && v) return 'REDACTED';
              return redactString(v);
            }
            if (Array.isArray(v)) return v.map((x) => redactDeep(x, null));
            if (isObj(v)) {
              const o = {};
              Object.keys(v).forEach((k) => {
                const x = v[k];
                if (/^headers$/i.test(k) && isObj(x)) {
                  const h = {};
                  Object.keys(x).forEach((hk) => { h[hk] = 'REDACTED'; });
                  o[k] = h;
                } else if (SECRET_KEY.test(k) && x !== null && x !== undefined && typeof x !== 'boolean' && typeof x !== 'number') {
                  o[k] = 'REDACTED';
                } else {
                  o[k] = redactDeep(x, k);
                }
              });
              return o;
            }
            return v;
          };

          /* ---- snapshot (managed fields, normalised) ---- */
          const TOOL_VOLATILE = { id: 1, activation: 1 };
          const isSecretToolKey = (k) => /^(headers|auth|env|credentials?)$/i.test(k) || SECRET_KEY.test(k);
          const normValue = (v) => {
            if (typeof v === 'string') return redactUrl(v);
            if (Array.isArray(v)) return v.map(normValue);
            if (isObj(v)) {
              const o = {};
              Object.keys(v).sort().forEach((k) => { if (!isEmpty(v[k])) o[k] = normValue(v[k]); });
              return o;
            }
            return v;
          };
          const normTool = (t) => {
            const out = {};
            if (!isObj(t)) return { value: str(t) };
            Object.keys(t).sort().forEach((k) => {
              const v = t[k];
              if (TOOL_VOLATILE[k] || isEmpty(v)) return;
              if (isSecretToolKey(k)) { out[k + '~hash'] = sha(v); return; }
              if (k === 'max_num_results') { out[k] = num(v); return; }
              const n = normValue(v);
              out[k] = n;
              if (typeof v === 'string' && n !== v) out[k + '~hash'] = sha(v);
            });
            return out;
          };
          const byName = (a, b) => {
            const x = String(a.name || '') + '\u0000' + String(a.type || '');
            const y = String(b.name || '') + '\u0000' + String(b.type || '');
            return x < y ? -1 : (x > y ? 1 : 0);
          };
          const descText = (v) => {
            let x = v;
            if (typeof x === 'string') {
              const t = x.trim();
              if (t.charAt(0) !== '{') return x;
              try { x = JSON.parse(t); } catch (e) { return v; }
            }
            if (isObj(x)) {
              const vals = Object.keys(x).sort().map((k) => x[k]).filter((s) => typeof s === 'string' && s !== '');
              const uniq = vals.filter((s, i) => vals.indexOf(s) === i);
              return uniq.length === 1 ? uniq[0] : stable(x);
            }
            return str(x);
          };
          /* max_turns / max_tokens are managed only when the expected body sets them (never sent as null,
             which would reset them); skills / hooks only when it carries an array. */
          const flagsOf = (exp) => ({
            turns: isObj(exp) && !isEmpty(exp.max_turns),
            tokens: isObj(exp) && !isEmpty(exp.max_tokens),
            skills: isObj(exp) && Array.isArray(exp.skills),
            hooks: isObj(exp) && Array.isArray(exp.hooks)
          });
          const without = (snap, keys) => {
            const o = {};
            Object.keys(snap).forEach((k) => { if (keys.indexOf(k) < 0) o[k] = snap[k]; });
            return o;
          };
          const normSkill = (x) => {
            if (!isObj(x)) return { name: str(x) };
            const o = { name: str(x.name), display_name: sha(str(x.display_name)), description: sha(str(x.description)),
              instructions: sha(str(x.instructions)), length: (str(x.instructions) || '').length };
            if (x.skill_id) o.skill_id = str(x.skill_id);
            return o;
          };
          const normHook = (h) => (isObj(h) ? normValue(h) : { id: str(h) });
          const byId = (a, b) => (String(a.id || '') < String(b.id || '') ? -1 : (String(a.id || '') > String(b.id || '') ? 1 : 0));
          const listDiff = (from, to, idKey, fieldsOf) => {
            const out = { added: [], removed: [], changed: [] };
            const A = Array.isArray(from) ? from : [], B = Array.isArray(to) ? to : [];
            A.forEach((a) => {
              const b = B.find((x) => x[idKey] === a[idKey]);
              if (!b) { out.removed.push(a[idKey]); return; }
              const keys = {};
              (fieldsOf ? fieldsOf : Object.keys(a).concat(Object.keys(b))).forEach((k) => { keys[k] = 1; });
              const fields = Object.keys(keys).filter((k) => stable(a[k]) !== stable(b[k]));
              if (fields.length) {
                const c = {};
                c[idKey] = a[idKey];
                c.fields = fields;
                if (idKey === 'name' && a.length !== undefined) { c.fromLength = a.length; c.toLength = b.length; }
                out.changed.push(c);
              }
            });
            B.forEach((b) => { if (!A.find((x) => x[idKey] === b[idKey])) out.added.push(b[idKey]); });
            return out;
          };
          const skillDiff = (from, to) => listDiff(from, to, 'name', ['display_name', 'description', 'instructions', 'skill_id']);
          const hookDiff = (from, to) => listDiff(from, to, 'id', null);
          const snapshot = (cfg, fl) => {
            const f = isObj(fl) ? fl : {};
            const c = isObj(cfg) ? cfg : {};
            const tools = (Array.isArray(c.tools) ? c.tools : []).map(normTool).sort(byName);
            const subs = (Array.isArray(c.sub_agents) ? c.sub_agents : []).map((s) => ({
              agent_id: str(s && s.agent_id), name: str(s && s.name), description: str(s && s.description)
            })).sort(byName);
            const snap = {
              description: descText(c.description),
              instructions: str(c.instructions),
              model: str(c.model),
              temperature: num(c.temperature),
              tool_call_budget: num(c.tool_call_budget),
              token_budget: num(c.token_budget),
              visibility: str(c.visibility),
              sub_agents: subs,
              tools: tools
            };
            if (f.turns) snap.max_turns = num(c.max_turns);
            if (f.tokens) snap.max_tokens = num(c.max_tokens);
            if (f.skills) snap.skills = (Array.isArray(c.skills) ? c.skills : []).map(normSkill).sort(byName);
            if (f.hooks) snap.hooks = (Array.isArray(c.hooks) ? c.hooks : []).map(normHook).sort(byId);
            return snap;
          };

          /* ---- diff (describe and drift summary) ---- */
          const lines = (s) => String(s || '').replace(/\r\n/g, '\n').split('\n');
          const cut = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);
          const lineDiff = (a, b, maxOut) => {
            const A = lines(a), B = lines(b);
            let p = 0;
            while (p < A.length && p < B.length && A[p] === B[p]) p++;
            let ea = A.length - 1, eb = B.length - 1;
            while (ea >= p && eb >= p && A[ea] === B[eb]) { ea--; eb--; }
            const a2 = A.slice(p, ea + 1), b2 = B.slice(p, eb + 1);
            const out = [];
            let truncated = false;
            const push = (o) => { if (out.length < maxOut) out.push(o); else truncated = true; };
            if (a2.length * b2.length <= 4000000) {
              const n = a2.length, m = b2.length;
              const L = [];
              for (let i = 0; i <= n; i++) L.push(new Uint32Array(m + 1));
              for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
                L[i][j] = a2[i] === b2[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
              }
              let i = 0, j = 0;
              while (i < n || j < m) {
                if (i < n && j < m && a2[i] === b2[j]) { i++; j++; continue; }
                if (i < n && (j >= m || L[i + 1][j] >= L[i][j + 1])) { push({ op: '-', line: p + i + 1, text: cut(a2[i], 300) }); i++; }
                else { push({ op: '+', line: p + j + 1, text: cut(b2[j], 300) }); j++; }
              }
            } else {
              a2.forEach((t, k) => push({ op: '-', line: p + k + 1, text: cut(t, 300) }));
              b2.forEach((t, k) => push({ op: '+', line: p + k + 1, text: cut(t, 300) }));
            }
            return { firstDifferingLine: p + 1, fromLines: A.length, toLines: B.length, changes: out, truncated: truncated };
          };
          const toolTarget = (t) => t.vector_store_id || (t.server ? String(t.server).split('?')[0] : null) ||
            (t.function && t.function.name) || null;
          const SCALARS = ['description', 'model', 'temperature', 'tool_call_budget', 'token_budget', 'max_turns', 'max_tokens', 'visibility'];
          const diffSnap = (from, to, detail) => {
            const changes = [];
            const fields = {};
            SCALARS.forEach((f) => {
              if (stable(from[f]) !== stable(to[f])) {
                changes.push(f);
                fields[f] = { from: from[f], to: to[f] };
              }
            });
            if (fields.description && !detail) fields.description = { changed: true };
            let instructions = { same: true, length: (to.instructions || '').length };
            if ((from.instructions || '') !== (to.instructions || '')) {
              changes.push('instructions');
              const ld = lineDiff(from.instructions, to.instructions, detail ? 200 : 3);
              instructions = {
                same: false,
                fromLength: (from.instructions || '').length,
                toLength: (to.instructions || '').length,
                firstDifferingLine: ld.firstDifferingLine,
                fromLines: ld.fromLines,
                toLines: ld.toLines,
                changes: ld.changes,
                truncated: ld.truncated
              };
            }
            const fromTools = from.tools || [], toTools = to.tools || [];
            const used = {};
            const tools = { added: [], removed: [], renamed: [], changed: [] };
            fromTools.forEach((ft) => {
              let k = toTools.findIndex((tt, i) => !used[i] && tt.name === ft.name);
              let how = 'name';
              if (k < 0 && toolTarget(ft)) {
                k = toTools.findIndex((tt, i) => !used[i] && tt.type === ft.type && toolTarget(tt) === toolTarget(ft));
                how = 'target';
              }
              if (k < 0) { tools.removed.push({ name: ft.name, type: ft.type }); return; }
              used[k] = true;
              const tt = toTools[k];
              const keys = {};
              Object.keys(ft).concat(Object.keys(tt)).forEach((x) => { keys[x] = 1; });
              const diffKeys = Object.keys(keys).filter((x) => stable(ft[x]) !== stable(tt[x]));
              if (how === 'target') tools.renamed.push({ from: ft.name, to: tt.name, type: tt.type, fields: diffKeys });
              else if (diffKeys.length) tools.changed.push({ name: ft.name, type: tt.type, fields: diffKeys });
            });
            toTools.forEach((tt, i) => { if (!used[i]) tools.added.push({ name: tt.name, type: tt.type }); });
            if (tools.added.length || tools.removed.length || tools.changed.length || tools.renamed.length) changes.push('tools');
            const fromSubs = from.sub_agents || [], toSubs = to.sub_agents || [];
            const subAgents = { added: [], removed: [], changed: [] };
            fromSubs.forEach((fs) => {
              const ts = toSubs.find((x) => x.name === fs.name);
              if (!ts) subAgents.removed.push(fs.name);
              else if (stable(fs) !== stable(ts)) subAgents.changed.push(fs.name);
            });
            toSubs.forEach((ts) => { if (!fromSubs.find((x) => x.name === ts.name)) subAgents.added.push(ts.name); });
            if (subAgents.added.length || subAgents.removed.length || subAgents.changed.length) changes.push('subAgents');
            const skills = ('skills' in from || 'skills' in to) ? skillDiff(from.skills, to.skills) : { added: [], removed: [], changed: [] };
            if (skills.added.length || skills.removed.length || skills.changed.length) changes.push('skills');
            const hooks = ('hooks' in from || 'hooks' in to) ? hookDiff(from.hooks, to.hooks) : null;
            if (hooks && (hooks.added.length || hooks.removed.length || hooks.changed.length)) changes.push('hooks');
            const parts = [];
            if (!instructions.same) {
              parts.push('instructions ' + instructions.fromLength + ' -> ' + instructions.toLength + ' chars (first difference at line ' +
                instructions.firstDifferingLine + ')');
            }
            SCALARS.slice(1).forEach((f) => { if (fields[f]) parts.push(f + ' ' + fields[f].from + ' -> ' + fields[f].to); });
            if (fields.description) parts.push('description changed');
            if (tools.added.length) parts.push('tools added: ' + tools.added.map((t) => t.name).join(', '));
            if (tools.removed.length) parts.push('tools removed: ' + tools.removed.map((t) => t.name).join(', '));
            if (tools.renamed.length) parts.push('tools renamed: ' + tools.renamed.map((t) => t.from + ' -> ' + t.to).join(', '));
            if (tools.changed.length) parts.push('tools changed: ' + tools.changed.map((t) => t.name + ' (' + t.fields.join(', ') + ')').join(', '));
            if (changes.indexOf('subAgents') >= 0) parts.push('sub agents changed');
            if (skills.added.length) parts.push('skills added: ' + skills.added.join(', '));
            if (skills.removed.length) parts.push('skills removed: ' + skills.removed.join(', '));
            if (skills.changed.length) parts.push('skills changed: ' + skills.changed.map((k) => k.name).join(', '));
            if (hooks && (hooks.added.length || hooks.removed.length || hooks.changed.length)) parts.push('hooks changed');
            const res = { same: !changes.length, changes: changes, summary: cut(parts.join('; '), 900), fields: fields,
              instructions: instructions, tools: tools, skills: skills, subAgents: subAgents };
            if (hooks) res.hooks = hooks;
            return res;
          };

          /* ---- sync plan: what applying expected over the live agent changes (check / plan) ---- */
          const PLAN_KEPT = ['max_turns', 'max_tokens', 'fallback_models', 'allowed_models', 'skills', 'guardrails', 'tool_permissions',
            'tool_activation', 'hooks', 'rate_limits', 'canvas_enabled', 'conversation_file_tools_enabled', 'starters', 'category',
            'tags', 'icon_url', 'conversation_kb_id', 'profile'];
          const toolRef = (t) => {
            if (!isObj(t)) return null;
            if (t.vector_store_id) return 'kb:' + t.vector_store_id;
            const sv = t.server ? String(t.server).split('?')[0] : '';
            const m = sv.match(/\/knowledge_bases\/([^/?]+)\/mcp/);
            if (m) return 'kb:' + m[1];
            if (sv) return 'server:' + sv;
            if (t.type === 'system') return 'system:' + t.name;
            return null;
          };
          const paths = (v, pre, out) => {
            if (isObj(v)) { Object.keys(v).forEach((k) => paths(v[k], pre ? pre + '.' + k : k, out)); return out; }
            if (Array.isArray(v)) {
              v.forEach((x, i) => {
                const id = isObj(x) && (x.id || x.name) ? String(x.id || x.name) : String(i);
                paths(x, (pre || '') + '[' + id + ']', out);
              });
              if (!v.length) out[pre] = '[]';
              return out;
            }
            out[pre] = stable(v);
            return out;
          };
          const short = (v) => cut(typeof v === 'string' ? v : stable(v), 200);
          const typeOf = (t) => t.type || '?';
          const buildPlan = (liveDoc, exp, skipped) => {
            const fl = flagsOf(exp);
            const L = snapshot(liveDoc, fl), E = snapshot(exp, fl);
            const destructive = [];
            const fields = [];
            ['model', 'temperature', 'tool_call_budget', 'token_budget', 'max_turns', 'max_tokens', 'visibility', 'description'].forEach((f) => {
              if (stable(L[f]) === stable(E[f])) return;
              fields.push({ field: f, from: f === 'description' ? cut(String(L[f] || ''), 300) : L[f], to: f === 'description' ? cut(String(E[f] || ''), 300) : E[f] });
              if (f === 'model') destructive.push('Model changed: ' + L[f] + ' -> ' + E[f] + '.');
              if (f === 'visibility') destructive.push('Visibility changed: ' + L[f] + ' -> ' + E[f] + '.');
              if ((f === 'tool_call_budget' || f === 'token_budget' || f === 'max_turns' || f === 'max_tokens') && L[f] !== null && L[f] !== undefined) {
                if (E[f] === null || E[f] === undefined) destructive.push(f + ' removed (' + L[f] + ' -> profile default).');
                else if (Number(E[f]) < Number(L[f])) destructive.push(f + ' lowered: ' + L[f] + ' -> ' + E[f] + '.');
              }
            });
            let instructions = null;
            const fi = L.instructions || '', ti = E.instructions || '';
            if (fi !== ti) {
              const ld = lineDiff(fi, ti, 100000);
              const added = ld.changes.filter((c) => c.op === '+').length;
              const removed = ld.changes.filter((c) => c.op === '-').length;
