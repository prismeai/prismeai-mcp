          const hash = crypto.createHash('sha256').update(t).digest('hex').slice(0, 16);
          const lines = t.length ? t.replace(/\r\n/g, '\n').replace(/\n$/, '').split('\n').length : 0;
          return { hash: hash, lines: lines, length: t.length, base64: Buffer.from(t, 'utf8').toString('base64') };
        } catch (err) {
          return { error: 'Sha256Failed', message: err && err.message };
        }
    benchEngine:
      language: nodejs
      parameters:
        op:
          type: string
          description: cases | units | plan | collect | report | export
        bench:
          type: object
          description: Bench row data (plan, units, report), or the whole bench row {key, status, data, updatedAt} (export header)
        units:
          type: object
          description: Case rows of the bench (state rows benchcase:<benchId>:*)
        cases:
          type: object
          description: 'cases: raw cases; units: normalised cases; collect: Evaluation.listCases items of the agent'
        agents:
          type: object
          description: 'units: targeted agents [{key, id}]'
        runner:
          type: object
          description: config.evaluation.runner (defaults applied here)
        run:
          type: object
          description: 'collect: Evaluation.getRun body with results'
        runId:
          type: string
          description: 'collect: run id of the batch'
        reason:
          type: string
          description: 'collect: completed | stalled | missing | interrupted'
        options:
          type: object
          description: 'Op options: defaultCriteria (cases); onlyErrored, ids, tags, limit (units); recentStarts (plan); worst (report); part, exportedAt, trigger, report, counts (export)'
        manifest:
          type: object
          description: 'report: {agents: config.agents, evaluation: config.evaluation}'
        now:
          type: string
          description: Optional ISO date (tests); default now
      code: |
        /*
          benchEngine(op, bench, units, cases, agents, runner, run, runId, reason, options, manifest, now)
          Pure bench engine of the evaluation module (no I/O). Every op returns {error, message} instead of throwing.

          Row shapes (DESIGN.md section 3):
            case row  key benchcase:<benchId>:<agentKey>:<caseId>, kind benchcase,
                      status pending | inflight | done | errored | cancelled,
                      data {benchId, agentKey, agentId, caseId, order, question, expected, criteria, tags,
                            case (the Agent Evaluations case), answer, score, passed, reasons, tokens, durationMs,
                            attempts, rateRetries, notBefore, runId, batchNo, lastRunId, lastError, result, history}
            bench row data {agentKeys, agents {key: {id, score, passRate, total, completed, errored, status, ...}},
                      runner, totals, batches {key: {runId, batchNo, n, caseIds, startedAt, lastProgressAt, lastCompleted}},
                      starts [{at, n, agentKey}], batchLog, batchCount, lastStartAgent, startedAt, ...}

          op cases   (cases, options {defaultCriteria}) → {cases (normalised {id, question, expected, criteria, tags,
                     expected_tools?, forbidden_tools?}), evalCases (Agent Evaluations cases), count, hash, errors}.
                     A case is {id, question, expected, criteria, tags}; input / expected_output are accepted as aliases.
                     Invalid entries are skipped and listed in errors. The case id travels as the tag case:<id>.
          op units   (bench {benchId}, cases (normalised), agents [{key, id}], units (existing case rows of the bench),
                     runner, options {onlyErrored, ids, tags, limit}) → {units [{key, kind, status, data}], byAgent
                     {key: {queued, skippedInFlight, cancelled, unchanged}}, count, casesCount, unknownIds, partial, runner}.
                     Full mode (re)queues every selected case of the agents (cases in a batch in flight excepted) and
                     cancels the rows whose case left the set (never with a filter). onlyErrored requeues only errored /
                     cancelled rows (attempts reset).
          op plan    (bench, units, runner, options {recentStarts}) → {now, progress, totals, agents, casesInWindow,
                     budgetLeft, next {agentKey, agentId, n, caseIds, cases, units}, blocked, nextAt, allDone, eta, avgCaseMs,
                     inFlightAgents, parallelAgents, deferred, orphans}. One batch at most per agent in flight, agents
                     alternate after bench.lastStartAgent, at most runner.parallelAgents agents in flight, cases started in
                     the last hour (this bench + recentStarts) stay within runner.messagesPerHour.
          op collect (units, runId, run (Evaluation.getRun body with results), cases (Evaluation.listCases items of the
                     agent = the batch), runner, reason completed | stalled | missing | interrupted) → {updates [{key, status,
                     data}], summary {done, retried, rateRetried, errored, unmatchedResults, interrupted?}}.
                     Error-like results go back to pending until runner.maxAttempts, then errored; quota / rate results are
                     requeued with a backoff (notBefore) without consuming an attempt, up to runner.maxRateRetries; a monthly
                     quota exhaustion is errored at once; interrupted = unfinished cases back to pending, attempts unchanged.
          op report  (bench, units, manifest {agents: config.agents, evaluation}) → {benchId, engine, startedAt,
                     erroredThreshold, contextSharedPerBatch, totals, agents, summary, cases, comparison {valid, reason, table,
                     pairs}, comparisons, worst [{caseId, agent, score, reasons}], replay, rejected, notes}.
                     Errored cases are excluded from score and passRate; erroredRate = (errored + not executed) / total; an
                     agent above the threshold is rejected (not comparable). Pairs compare every two agents on their common
                     non-errored cases, a = baseline (the variantOf target when one derives from the other).
          op export  options.part header (bench row {key, status, data, updatedAt}, options {exportedAt, trigger, report,
                     counts}) → {line, stamp, fileName}; options.part records (units) → {lines, count}: JSON Lines, one line
                     per (agent, case) with question, expected, answer, score, passed, judge reasons, tokens, duration.
        */
        try {
          const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
          const arr = (v) => { let x = v; if (typeof x === 'string') { try { x = JSON.parse(x); } catch (e) { x = []; } } return Array.isArray(x) ? x : []; };
          const obj = (v) => { let x = v; if (typeof x === 'string') { try { x = JSON.parse(x); } catch (e) { x = null; } } return isObj(x) ? x : {}; };
          const str = (v) => (v === undefined || v === null) ? '' : (typeof v === 'string' ? v.trim() : (typeof v === 'object' ? JSON.stringify(v) : String(v).trim()));
          const nn = (v) => (v === undefined ? null : v);
          const opt = obj(typeof options === 'undefined' ? null : options);
          const nowRaw = typeof now === 'undefined' ? null : now;
          const nowMs = (typeof nowRaw === 'string' && Number.isFinite(Date.parse(nowRaw))) ? Date.parse(nowRaw) : Date.now();
          const nowIso = new Date(nowMs).toISOString();
          const HOUR = 3600000;
          const round = (v, d) => { const p = Math.pow(10, d); return Math.round(v * p) / p; };
          const mean = (a) => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
          const CASE_TAG = 'case:';
          const opName = String(typeof op === 'undefined' ? '' : op);
          const pRunner = typeof runner === 'undefined' ? null : runner;
          const pBench = obj(typeof bench === 'undefined' ? null : bench);
          const pUnits = arr(typeof units === 'undefined' ? null : units).filter((r) => r && r.key);
          const pManifest = obj(typeof manifest === 'undefined' ? null : manifest);

          const runnerOf = (r) => {
            const x = obj(r);
            const int = (v, d, min) => { const n = Number(v); return Number.isFinite(n) && n >= min ? Math.floor(n) : d; };
            const thr = Number(x.erroredThreshold);
            return {
              batchSize: int(x.batchSize, 5, 1),
              maxAttempts: int(x.maxAttempts, 2, 1),
              messagesPerHour: int(x.messagesPerHour, 120, 1),
              parallelAgents: int(x.parallelAgents, 1, 1),
              batchTimeoutMin: int(x.batchTimeoutMin, 45, 2),
              maxRateRetries: int(x.maxRateRetries, 10, 0),
              erroredThreshold: Number.isFinite(thr) && thr >= 0 && thr <= 1 ? thr : 0.05
            };
          };
          const rn = runnerOf(pRunner || pBench.runner);
          const caseIdOf = (tags) => {
            const t = arr(tags).find((x) => String(x).indexOf(CASE_TAG) === 0);
            return t ? String(t).slice(CASE_TAG.length) : '';
          };
          const safeId = (v) => str(v).replace(/[^A-Za-z0-9_.-]+/g, '_').slice(0, 120);
          const listOf = (v) => {
            let x = v;
            if (typeof x === 'string') { try { x = JSON.parse(x); } catch (e) { x = [x]; } }
            return Array.isArray(x) ? x.map(str).filter(Boolean) : [];
          };
          const evalCaseOf = (c) => {
            const e = { input: c.question, expected_output: c.expected || '', criteria: c.criteria, tags: c.tags.concat([CASE_TAG + c.id]) };
            if (c.expected_tools) e.expected_tools = c.expected_tools;
            if (c.forbidden_tools) e.forbidden_tools = c.forbidden_tools;
            return e;
          };
          const agentIdOf = (b, key) => {
            const a = obj(b.agents)[key];
            if (typeof a === 'string') return a;
            return isObj(a) && a.id ? a.id : null;
          };

          /* ---------------------------------------------------------------- cases */
          if (opName === 'cases') {
            const crypto = require('crypto');
            let list = typeof cases === 'undefined' ? null : cases;
            if (typeof list === 'string') { try { list = JSON.parse(list); } catch (e) { return { cases: [], evalCases: [], count: 0, hash: null, errors: ['cases is not valid JSON'] }; } }
            if (isObj(list) && Array.isArray(list.cases)) list = list.cases;
            if (!Array.isArray(list)) return { cases: [], evalCases: [], count: 0, hash: null, errors: ['cases must be an array of {id, question, expected, criteria, tags}'] };
            let defaults = listOf(opt.defaultCriteria);
            if (!defaults.length) defaults = ['The answer is correct, complete and consistent with the expected answer'];
            const errors = []; const out = []; const seen = {};
            list.forEach((c, i) => {
              const where = 'case ' + (i + 1);
              if (!isObj(c)) { errors.push(where + ': not an object'); return; }
              const id = safeId(c.id !== undefined ? c.id : c.qid);
              const question = str(c.question !== undefined ? c.question : c.input);
              if (!id) { errors.push(where + ': missing id'); return; }
              if (seen[id]) { errors.push(where + ' (' + id + '): duplicate id'); return; }
              if (!question) { errors.push(where + ' (' + id + '): missing question'); return; }
              seen[id] = true;
              let criteria = listOf(c.criteria);
              if (!criteria.length) criteria = defaults.slice();
              const n = { id: id, question: question, expected: str(c.expected !== undefined ? c.expected : c.expected_output), criteria: criteria, tags: listOf(c.tags).map((t) => t.replace(/\s+/g, '_')).filter((t) => t.indexOf(CASE_TAG) !== 0) };
              if (Array.isArray(c.expected_tools) && c.expected_tools.length) n.expected_tools = c.expected_tools;
              if (Array.isArray(c.forbidden_tools) && c.forbidden_tools.length) n.forbidden_tools = c.forbidden_tools;
              out.push(n);
            });
            const hash = out.length ? crypto.createHash('sha256').update(JSON.stringify(out)).digest('hex').slice(0, 16) : null;
            return { cases: out, evalCases: out.map(evalCaseOf), count: out.length, hash: hash, errors: errors };
          }

          /* ---------------------------------------------------------------- units */
          if (opName === 'units') {
            const bid = str(pBench.benchId);
            if (!bid) return { error: 'InvalidOp', message: 'bench.benchId is required' };
            const list = arr(typeof cases === 'undefined' ? null : cases).filter((c) => isObj(c) && c.id && c.question);
            const agentList = arr(typeof agents === 'undefined' ? null : agents).filter((a) => a && a.key);
            const only = opt.onlyErrored === true || opt.onlyErrored === 'true';
            const ids = listOf(opt.ids);
            const tags = listOf(opt.tags);
            const limit = Number(opt.limit);
            let selected = list.map((c, i) => ({ c: c, order: i }));
            const unknownIds = ids.filter((id) => !list.some((c) => c.id === id));
            if (ids.length) selected = selected.filter((x) => ids.indexOf(x.c.id) >= 0);
            if (tags.length) selected = selected.filter((x) => arr(x.c.tags).some((t) => tags.indexOf(t) >= 0));
            if (Number.isFinite(limit) && limit >= 1) selected = selected.slice(0, Math.floor(limit));
            const partial = ids.length > 0 || tags.length > 0 || (Number.isFinite(limit) && limit >= 1);
            const byKey = {};
            pUnits.forEach((r) => { byKey[r.key] = r; });
            const out = []; const byAgent = {}; const inSet = {};
            agentList.forEach((a) => { byAgent[a.key] = { queued: 0, skippedInFlight: 0, cancelled: 0, unchanged: 0 }; });
            selected.forEach((x) => {
              const c = x.c;
              agentList.forEach((a) => {
                const key = 'benchcase:' + bid + ':' + a.key + ':' + c.id;
                inSet[key] = true;
                const ex = byKey[key];
                const exData = ex ? obj(ex.data) : {};
                const fresh = {
                  benchId: bid, agentKey: a.key, agentId: a.id || exData.agentId || null, caseId: c.id, order: x.order,
                  question: c.question, expected: c.expected, criteria: c.criteria, tags: c.tags, case: evalCaseOf(c),
                  answer: null, score: null, passed: null, reasons: null, tokens: null, durationMs: null,
                  attempts: 0, rateRetries: 0, notBefore: null, runId: null, batchNo: null, lastRunId: null,
                  lastError: null, result: null, history: arr(exData.history).slice(-10), queuedAt: nowIso,
                  replays: (Number(exData.replays) || 0) + (ex ? 1 : 0)
                };
                if (only) {
                  if (ex && (ex.status === 'errored' || ex.status === 'cancelled')) { out.push({ key: key, kind: 'benchcase', status: 'pending', data: fresh }); byAgent[a.key].queued++; }
                  else byAgent[a.key].unchanged++;
                  return;
                }
                if (ex && ex.status === 'inflight') { byAgent[a.key].skippedInFlight++; return; }
                out.push({ key: key, kind: 'benchcase', status: 'pending', data: fresh });
                byAgent[a.key].queued++;
              });
            });
            if (!only && !partial) {
              pUnits.forEach((r) => {
                if (inSet[r.key] || r.status === 'cancelled' || r.status === 'inflight') return;
                const d = obj(r.data);
                if (!byAgent[d.agentKey]) return;
                out.push({ key: r.key, kind: 'benchcase', status: 'cancelled', data: Object.assign({}, d, { cancelledAt: nowIso }) });
                byAgent[d.agentKey].cancelled++;
              });
            }
            return { units: out, byAgent: byAgent, count: out.filter((u) => u.status === 'pending').length, casesCount: selected.length, unknownIds: unknownIds, partial: partial, runner: rn };
          }

          /* shared: per-agent progress from the case rows */
          const progressOf = (b, rows) => {
            const batches = obj(b.batches);
            const agentKeys = arr(b.agentKeys).map(String);
            rows.forEach((r) => { const k = r.data && r.data.agentKey; if (k && agentKeys.indexOf(k) < 0) agentKeys.push(k); });
            const totals = { total: 0, pending: 0, inFlight: 0, done: 0, passed: 0, failed: 0, errored: 0, cancelled: 0 };
            const progress = {}; const pendingBy = {}; const scoresBy = {}; const orphans = [];
            agentKeys.forEach((k) => { progress[k] = { total: 0, pending: 0, inFlight: 0, done: 0, passed: 0, failed: 0, errored: 0, cancelled: 0, batches: 0, batch: null }; pendingBy[k] = []; scoresBy[k] = []; });
            rows.forEach((r) => {
              const d = obj(r.data);
              const p = progress[d.agentKey];
              if (!p) return;
              if (r.status === 'cancelled') { p.cancelled++; totals.cancelled++; return; }
              p.total++; totals.total++;
              if (r.status === 'pending') { p.pending++; totals.pending++; pendingBy[d.agentKey].push({ key: r.key, data: d }); }
              else if (r.status === 'inflight') {
                p.inFlight++; totals.inFlight++;
                const bt = batches[d.agentKey];
                if (!bt || !bt.runId || bt.runId !== d.runId) orphans.push({ key: r.key, data: Object.assign({}, d, { runId: null }) });
              } else if (r.status === 'done') {
                p.done++; totals.done++;
                if (d.passed === true) { p.passed++; totals.passed++; } else { p.failed++; totals.failed++; }
                scoresBy[d.agentKey].push(Number(d.score) || 0);
              } else if (r.status === 'errored') { p.errored++; totals.errored++; }
            });
            const inFlightAgents = [];
            agentKeys.forEach((k) => {
              const bt = batches[k];
              if (bt && bt.runId) {
                inFlightAgents.push(k);
                progress[k].batch = { runId: bt.runId, batchNo: nn(bt.batchNo), n: nn(bt.n), startedAt: nn(bt.startedAt), completed: bt.lastCompleted || 0 };
              }
            });
            arr(b.batchLog).forEach((l) => { if (l && progress[l.agentKey]) progress[l.agentKey].batches++; });
            const summary = {};
            agentKeys.forEach((k) => {
              const p = progress[k]; const s = mean(scoresBy[k]);
              const prev = obj(obj(b.agents)[k]);
              summary[k] = Object.assign({}, prev, {
                id: agentIdOf(b, k), total: p.total, pending: p.pending, inFlight: p.inFlight, done: p.done, passed: p.passed,
                failed: p.failed, errored: p.errored, completed: p.done + p.errored,
                score: s === null ? null : round(s, 3), passRate: p.done ? round(p.passed / p.done, 3) : null,
                status: (p.pending + p.inFlight) > 0 ? 'running' : (p.total ? 'completed' : 'pending')
              });
            });
            return { agentKeys: agentKeys, totals: totals, progress: progress, pendingBy: pendingBy, orphans: orphans, inFlightAgents: inFlightAgents, summary: summary, batches: batches };
          };

          /* ---------------------------------------------------------------- plan */
          if (opName === 'plan') {
            const b = pBench;
            const pr = progressOf(b, pUnits);
            const batchSize = rn.batchSize; const mph = rn.messagesPerHour; const parallelAgents = rn.parallelAgents;
            const starts = [];
            arr(b.starts).concat(arr(opt.recentStarts)).forEach((s) => {
              if (!s) return;
              const t = Date.parse(s.at); const n = Number(s.n) || 0;
              if (Number.isFinite(t) && t <= nowMs && nowMs - t < HOUR && n > 0) starts.push({ t: t, n: n });
            });
            starts.sort((x, y) => x.t - y.t);
            const casesInWindow = starts.reduce((s, x) => s + x.n, 0);
            const budgetLeft = Math.max(0, mph - casesInWindow);
            let order = pr.agentKeys.slice();
            const li = pr.agentKeys.indexOf(b.lastStartAgent);
            if (li >= 0) order = pr.agentKeys.slice(li + 1).concat(pr.agentKeys.slice(0, li + 1));
            let next = null; let blocked = null; let nextAt = null; let deferred = 0; let earliest = null;
            const readyBy = {};
            pr.agentKeys.forEach((k) => {
              readyBy[k] = pr.pendingBy[k].filter((u) => {
                const nb = Date.parse(u.data.notBefore);
                if (Number.isFinite(nb) && nb > nowMs) {
                  deferred++;
                  if (!(pr.batches[k] && pr.batches[k].runId) && (earliest === null || nb < earliest)) earliest = nb;
                  return false;
                }
                return true;
              });
            });
            const parallelFull = pr.inFlightAgents.length >= parallelAgents;
            for (let i = 0; i < order.length; i++) {
              const k = order[i];
              if (pr.batches[k] && pr.batches[k].runId) continue;
              const pend = readyBy[k].slice().sort((x, y) => (Number(x.data.order) || 0) - (Number(y.data.order) || 0));
              if (!pend.length) continue;
              const agentId = agentIdOf(b, k) || pend[0].data.agentId || null;
              if (!agentId) continue;
              if (parallelFull) { blocked = { reason: 'parallelAgents', inFlightAgents: pr.inFlightAgents.slice(), parallelAgents: parallelAgents }; break; }
              const batch = pend.slice(0, batchSize);
              if (batch.length > budgetLeft) {
                blocked = { reason: 'messagesPerHour', agentKey: k, need: batch.length, budgetLeft: budgetLeft };
                let left = casesInWindow;
                for (let j = 0; j < starts.length; j++) {
                  left -= starts[j].n;
                  if (left <= mph - batch.length) { nextAt = new Date(starts[j].t + HOUR).toISOString(); break; }
                }
                break;
              }
              next = { agentKey: k, agentId: agentId, n: batch.length, caseIds: batch.map((u) => u.data.caseId), cases: batch.map((u) => u.data.case), units: batch };
              break;
            }
            if (!next && !blocked && !parallelFull && earliest !== null) nextAt = new Date(earliest).toISOString();
            let caseMs = 0; let caseN = 0;
            arr(b.batchLog).forEach((l) => {
              const s = Date.parse(l && l.startedAt); const e = Date.parse(l && l.endedAt); const n = Number(l && l.n) || 0;
              if (Number.isFinite(s) && Number.isFinite(e) && e > s && n > 0) { caseMs += e - s; caseN += n; }
            });
            const avgCaseMs = caseN ? Math.round(caseMs / caseN) : null;
            const remaining = pr.totals.pending + pr.totals.inFlight;
            let eta = null;
            if (remaining === 0) eta = nowIso;
            else if (avgCaseMs) {
              let longest = 0;
              pr.agentKeys.forEach((k) => { longest = Math.max(longest, pr.progress[k].pending + pr.progress[k].inFlight); });
              let ms = Math.max(longest, remaining / parallelAgents) * avgCaseMs;
              if (pr.totals.pending > budgetLeft) ms = Math.max(ms, (pr.totals.pending - budgetLeft) / mph * HOUR);
              eta = new Date(nowMs + ms).toISOString();
            }
            return {
              now: nowIso, runner: rn, progress: pr.progress, totals: pr.totals, agents: pr.summary, casesInWindow: casesInWindow,
              budgetLeft: budgetLeft, next: next, blocked: blocked, nextAt: nextAt,
              allDone: pr.totals.total > 0 && remaining === 0 && pr.inFlightAgents.length === 0,
              eta: eta, avgCaseMs: avgCaseMs, inFlightAgents: pr.inFlightAgents, parallelAgents: parallelAgents,
              deferred: deferred, orphans: pr.orphans
            };
          }

          /* ---------------------------------------------------------------- collect */
          if (opName === 'collect') {
            const rid = str(typeof runId === 'undefined' ? '' : runId);
            const why = ['completed', 'stalled', 'missing', 'interrupted'].indexOf(String(typeof reason === 'undefined' ? '' : reason)) >= 0 ? String(reason) : 'completed';
            const batch = pUnits.filter((u) => u.status === 'inflight' && u.data && u.data.runId === rid);
            const byCase = {};
            batch.forEach((u) => { byCase[u.data.caseId] = u; });
            const caseOfAe = {};
            arr(typeof cases === 'undefined' ? null : cases).forEach((c) => { if (c && c.id) { const id = caseIdOf(c.tags); if (id) caseOfAe[c.id] = id; } });
            const results = arr(obj(typeof run === 'undefined' ? null : run).results);
            const matched = {}; let unmatched = 0;
            results.forEach((r) => {
              if (!r) return;
              let u = byCase[caseOfAe[r.case_id]];
              if (!u || matched[u.key]) u = batch.find((x) => !matched[x.key] && str(x.data.question) === str(r.input));
              if (!u || matched[u.key]) { unmatched++; return; }
              matched[u.key] = r;
            });
            const texts = (r) => [str(r.error), str(r.actual), str(r.judge_reasoning), str(r.error_kind)];
            const errorOf = (r) => {
              const actual = str(r.actual); const reasoning = str(r.judge_reasoning); const error = str(r.error);
              if (error) return { code: error.split(':')[0].slice(0, 80), detail: error.slice(0, 300) };
              if (r.errored === true) return { code: str(r.error_kind) || 'ERRORED', detail: (str(r.error_message) || reasoning).slice(0, 300) };
              if (/^EXECUTION_ERROR:/.test(actual)) return { code: 'EXECUTION_ERROR', detail: actual.slice(0, 300) };
              if (/^ERROR:/.test(actual)) return { code: 'AGENT_CALL_FAILED', detail: actual.slice(0, 300) };
              if (actual.indexOf('Reached maximum number of nested calls') >= 0) return { code: 'NESTED_CALLS_LIMIT', detail: actual.slice(0, 300) };
              if (/^RATE_LIMITED/.test(actual)) return { code: 'RATE_LIMITED', detail: actual.slice(0, 300) };
              if (actual.indexOf('Quota exceeded:') >= 0) return { code: 'QUOTA_EXCEEDED', detail: actual.slice(0, 300) };
              if (/^(RATE_LIMITED|JUDGE_ERROR)/.test(reasoning)) return { code: reasoning.indexOf('JUDGE_ERROR') === 0 ? 'JUDGE_ERROR' : 'RATE_LIMITED', detail: reasoning.slice(0, 300) };
              return null;
            };
            const isFinal = (r) => texts(r).some((t) => /QUOTA_EXHAUSTED|MONTHLY_(TOKENS|COST)_EXCEEDED/.test(t));
