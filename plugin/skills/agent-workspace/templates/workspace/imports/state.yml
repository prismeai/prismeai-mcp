    kind:
      type: text
      nullable: false
      description: resource | item | setting | lock | bench | benchcase | journal | overlay
    status:
      type: text
      nullable: true
    data:
      type: json
      nullable: true
    error:
      type: json
      nullable: true
    updatedAt:
      type: datetime
      nullable: true
  indexes:
    - properties:
        - kind
    - properties:
        - status
    - properties:
        - kind
        - status
  uniques:
    - properties:
